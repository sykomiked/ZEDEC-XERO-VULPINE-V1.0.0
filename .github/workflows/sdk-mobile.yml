# Mobile SDKs (sdk/mobile): the Kotlin SDK (JNI shim) on the host JVM, its
# Android AAR built with the NDK, the Dart/Flutter SDK on the Dart VM, the
# iOS xcframework of libzxv for Flutter apps, and the web kits (Z-Web and
# React-ZXV, on the TypeScript SDK's wasm build and addon). Every job builds
# libzxv itself and tests against sdk/conformance/vectors.json.
name: SDK mobile

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/mobile/**'
      - 'sdk/libzxv/**'
      - 'sdk/conformance/**'
      - '.github/workflows/sdk-mobile.yml'
      - 'build_system/sdk_kernel_deps.py'
      # kernel inputs of libzxv: build_system/sdk_kernel_deps.py --write
      - 'kernel/src/abacus/**'
      - 'kernel/src/aipi/**'
      - 'kernel/src/cardnet/**'
      - 'kernel/src/cbank/**'
      - 'kernel/src/e8/**'
      - 'kernel/src/edp_risk/**'
      - 'kernel/src/engine/**'
      - 'kernel/src/event_space/**'
      - 'kernel/src/finance/**'
      - 'kernel/src/freight/**'
      - 'kernel/src/harmonic/**'
      - 'kernel/src/hwemu/**'
      - 'kernel/src/ipfs_node/**'
      - 'kernel/src/iso20022/**'
      - 'kernel/src/lpres/**'
      - 'kernel/src/mlkem/**'
      - 'kernel/src/modbind/**'
      - 'kernel/src/onepolicy/**'
      - 'kernel/src/paradox/**'
      - 'kernel/src/pay/**'
      - 'kernel/src/phase_coord/**'
      - 'kernel/src/pqsec/**'
      - 'kernel/src/rational/**'
      - 'kernel/src/rmag/**'
      - 'kernel/src/robin_debanks/**'
      - 'kernel/src/surplus/**'
      - 'kernel/src/swarm/**'
      - 'kernel/src/tensor/**'
      - 'kernel/src/tls/**'
      - 'kernel/src/treaty/**'
      - 'kernel/src/trispace/**'
      - 'kernel/src/ubh/**'
      - 'kernel/src/vhub/**'
      - 'kernel/src/vino/**'
      - 'kernel/src/vino_stores/**'
      - 'kernel/src/web4/**'
      - 'kernel/src/zcapital/**'
      - 'kernel/include/**'
      - 'kernel/third_party/**'
      # end of the kernel inputs of libzxv
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'sdk/mobile/**'
      - 'sdk/libzxv/**'
      - 'sdk/conformance/**'
      - '.github/workflows/sdk-mobile.yml'
      - 'build_system/sdk_kernel_deps.py'
      # kernel inputs of libzxv: build_system/sdk_kernel_deps.py --write
      - 'kernel/src/abacus/**'
      - 'kernel/src/aipi/**'
      - 'kernel/src/cardnet/**'
      - 'kernel/src/cbank/**'
      - 'kernel/src/e8/**'
      - 'kernel/src/edp_risk/**'
      - 'kernel/src/engine/**'
      - 'kernel/src/event_space/**'
      - 'kernel/src/finance/**'
      - 'kernel/src/freight/**'
      - 'kernel/src/harmonic/**'
      - 'kernel/src/hwemu/**'
      - 'kernel/src/ipfs_node/**'
      - 'kernel/src/iso20022/**'
      - 'kernel/src/lpres/**'
      - 'kernel/src/mlkem/**'
      - 'kernel/src/modbind/**'
      - 'kernel/src/onepolicy/**'
      - 'kernel/src/paradox/**'
      - 'kernel/src/pay/**'
      - 'kernel/src/phase_coord/**'
      - 'kernel/src/pqsec/**'
      - 'kernel/src/rational/**'
      - 'kernel/src/rmag/**'
      - 'kernel/src/robin_debanks/**'
      - 'kernel/src/surplus/**'
      - 'kernel/src/swarm/**'
      - 'kernel/src/tensor/**'
      - 'kernel/src/tls/**'
      - 'kernel/src/treaty/**'
      - 'kernel/src/trispace/**'
      - 'kernel/src/ubh/**'
      - 'kernel/src/vhub/**'
      - 'kernel/src/vino/**'
      - 'kernel/src/vino_stores/**'
      - 'kernel/src/web4/**'
      - 'kernel/src/zcapital/**'
      - 'kernel/include/**'
      - 'kernel/third_party/**'
      # end of the kernel inputs of libzxv
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.14.3'
  NDK_VERSION: '27.2.12479018'

# Pushes run only on main and develop; pull requests run on every update and
# a newer push to the same pull request cancels the older run.
concurrency:
  group: sdk-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin-host:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: kotlin ${{ matrix.os }} JDK ${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: JDK ${{ matrix.jdk }} (runs the tests)
        id: testjdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: JDK 21 (runs Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build libzxv and the test fixtures
        run: make -C sdk/libzxv all fixtures
      - name: Kotlin + JNI shim tests against vectors.json
        run: gradle -p sdk/mobile/kotlin --no-daemon :zxv:test "-Pzxv.testJavaHome=${{ steps.testjdk.outputs.path }}"
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-tests-${{ matrix.os }}-jdk${{ matrix.jdk }}
          path: sdk/mobile/kotlin/zxv/build/reports/tests/

  android-aar:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: android aar (arm64-v8a, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # the default also asks for the retired 'tools' package, which the
          # current sdkmanager no longer has
          packages: platform-tools
      - name: Android SDK packages and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: libzxv.so for each ABI (NDK)
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}" sdk/mobile/kotlin/scripts/build-libzxv-android.sh arm64-v8a x86_64
      - name: Build the AAR and run Android lint
        run: gradle -p sdk/mobile/kotlin --no-daemon -Pzxv.android=true :zxv-android:assembleRelease :zxv-android:lintRelease
      - name: The AAR carries both libraries for both ABIs
        run: |
          aar=sdk/mobile/kotlin/android/build/outputs/aar/zxv-android-release.aar
          unzip -l "$aar"
          for abi in arm64-v8a x86_64; do
            for lib in libzxv.so libzxvjni.so; do
              unzip -l "$aar" | grep -q "jni/$abi/$lib" || { echo "missing jni/$abi/$lib"; exit 1; }
            done
          done
          mkdir -p /tmp/aar && unzip -oq "$aar" -d /tmp/aar
          readelf -d /tmp/aar/jni/arm64-v8a/libzxvjni.so | grep -q 'NEEDED.*libzxv.so'
      - uses: actions/upload-artifact@v4
        with:
          name: zxv-android-aar
          path: sdk/mobile/kotlin/android/build/outputs/aar/zxv-android-release.aar

  dart:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: dart ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/mobile/dart
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build libzxv and the test fixtures
        run: make -C ../../libzxv all fixtures
      - run: dart pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Tests against vectors.json
        run: |
          lib=libzxv.so; [ "$RUNNER_OS" = macOS ] && lib=libzxv.dylib
          ZXV_LIBRARY_PATH="$PWD/../../libzxv/build/$lib" dart test --reporter expanded
      - name: Example
        run: ZXV_LIBRARY_PATH="$PWD/../../libzxv/build" dart run example/main.dart

  ios-xcframework:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: ios xcframework (Flutter)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build Zxv.xcframework (device + simulator)
        run: sdk/mobile/dart/scripts/build-libzxv-xcframework.sh
      - name: Check the slices
        run: |
          fw=sdk/mobile/dart/build/Zxv.xcframework
          ls -R "$fw"
          xcrun lipo -info "$fw"/ios-arm64/libzxv.a
          xcrun lipo -info "$fw"/ios-arm64_x86_64-simulator/libzxv.a
          nm -gU "$fw"/ios-arm64/libzxv.a | grep -q '_zxv_hex_pack'
      - uses: actions/upload-artifact@v4
        with:
          name: Zxv.xcframework
          path: sdk/mobile/dart/build/Zxv.xcframework

  web-kits:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: web kits (z-web, react-zxv)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build libzxv and the test fixtures
        run: make -C sdk/libzxv all fixtures
      - name: '@zedec/zxv: addon, wasm (zig cc to wasm32-wasi), TypeScript'
        working-directory: sdk/typescript
        run: |
          npm ci
          python -m pip install ziglang==0.17.0
          npm run build:wasm
          npm run build:ts
      - name: 'Z-Web: typecheck and tests (worker_threads + real wasm)'
        working-directory: sdk/mobile/z-web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: 'React-ZXV: typecheck and tests (jsdom, addon, z-web)'
        working-directory: sdk/mobile/react-zxv
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
