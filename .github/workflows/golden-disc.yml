#
# Golden discs: a core disc per architecture and the swarm discs shared by
# all of them (build_system/mk_golden_disc.sh, docs/BAREMETAL.md). Each job
# builds its arch's core disc and the swarm discs, then boots under UEFI
# firmware with 4 GB and with 8 GB of RAM until the models verify and [AI_OK]
# prints: on x86_64 the kernel reads the core and swarm discs over AHCI and
# checks every model; on arm64 the loader checks the core disc's model (its
# kernel cannot reach swarm discs yet). Keeps the gzipped discs as workflow
# artifacts for seven days; the swarm discs once, from the x86_64 job.
#
#   - Manual only (workflow_dispatch). No push, pull request, tag or schedule.
#   - It never publishes and never creates a release. Attaching the golden
#     disc to a release is the owner's call (release.yml refuses weights).
#   - Models come only from the pinned URLs in build_system/golden.models and
#     are refused unless size and SHA-256 match.
name: Golden disc

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-disc
  cancel-in-progress: true

jobs:
  golden:
    name: golden disc ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build toolchain image
        run: docker build -f build_system/Dockerfile.baremetal -t zxv-baremetal .
      - name: Build the kernel, the core disc and the swarm discs (downloads the pinned models)
        run: docker run --rm -v "$PWD:/src" -w /src zxv-baremetal bash -c 'bash build_system/baremetal_images.sh ${{ matrix.arch }} && bash build_system/mk_golden_disc.sh ${{ matrix.arch }} && bash build_system/mk_golden_disc.sh swarm'
      - name: Boot it under UEFI firmware with 4 GB and 8 GB of RAM (models verified, [AI_OK])
        run: |
          set -eu
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            ENV=(-e UEFI_DISK=ahci -e UEFI_EXTRA="$(ls dist/discs/zxv-swarm-disc*.img | tr '\n' ' ')")
            MARKS=("[SWARM_MOUNTED] ZXV_SWARM_REASON on " "[MODELS_INDEXED] 2 listed (1 on the boot partition, 1 on 1 swarm disc)" "[MODELS_OK] 2 verified")
          else
            ENV=(-e UEFI_DISK=virtio)
            MARKS=("[MODELS_OK] 1 verified")
          fi
          for mem in 4G 8G; do
            docker run --rm "${ENV[@]}" -e UEFI_MEM="$mem" -v "$PWD:/src" -w /src zxv-baremetal \
              bash build_system/uefi_boot_check.sh ${{ matrix.arch }} dist/discs/zxv-${{ matrix.arch }}-disc1-core.img 600 "[AI_OK]" "${MARKS[@]}"
          done
      - name: Compress and report the sizes
        run: |
          set -eu
          sudo chown -R "$(id -u)" dist
          cd dist/discs
          discs="zxv-${{ matrix.arch }}-disc1-core.img"
          [ "${{ matrix.arch }}" = x86_64 ] && discs="$discs $(ls zxv-swarm-disc*.img | tr '\n' ' ')"
          for d in $discs; do
            gzip -9 -n -c "$d" > "$d.gz"
            sha256sum "$d.gz" > "$d.gz.sha256"
          done
          { echo '```'; for d in $discs; do cat "${d%.img}.sizes"; done; ls -l ./*.gz; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: golden-discs-${{ matrix.arch }}
          retention-days: 7
          compression-level: 0
          path: |
            dist/discs/*.img.gz
            dist/discs/*.img.gz.sha256
            dist/discs/zxv-*-disc*.sizes
          if-no-files-found: error
