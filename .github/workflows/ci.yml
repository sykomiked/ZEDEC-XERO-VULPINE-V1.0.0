name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-system-arm xorriso
      - name: Build ARM64
        run: |
          make -f build_system/Makefile.arm64 clean
          make -f build_system/Makefile.arm64 all
      - name: Run ARM64 in QEMU
        run: |
          timeout 30 make -f build_system/Makefile.arm64 run || true
      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: kernel_arm64.elf

  build-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install x86_64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm qemu-system-x86 xorriso grub-pc-bin grub-common
      - name: Build x86_64
        run: |
          make -f build_system/Makefile.x86_64 clean
          make -f build_system/Makefile.x86_64 all
      - name: Run x86_64 in QEMU
        run: |
          timeout 30 make -f build_system/Makefile.x86_64 run || true
      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-x86_64
          path: kernel_x86_64.elf

  build-riscv64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V 64-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv64
      - name: Build RISC-V 64-bit
        run: |
          make -f build_system/Makefile.riscv clean
          make -f build_system/Makefile.riscv all
      - name: Run RISC-V 64-bit in QEMU
        run: |
          timeout 30 make -f build_system/Makefile.riscv run || true
      - name: Upload RISC-V 64-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-riscv64
          path: kernel_riscv64.elf

  build-riscv32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V 32-bit toolchain
        # Ubuntu ships no riscv32 cross compiler; the riscv64 one builds rv32
        # through -march=rv32... -mabi=ilp32d (see Makefile.riscv32).
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-misc
      - name: Build RISC-V 32-bit
        run: |
          make -f build_system/Makefile.riscv32 clean
          make -f build_system/Makefile.riscv32 all
      - name: Run RISC-V 32-bit in QEMU
        run: |
          timeout 30 make -f build_system/Makefile.riscv32 run || true
      - name: Upload RISC-V 32-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-riscv32
          path: kernel_riscv32.elf

  build-arm32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM32 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-system-arm
      - name: Build ARM32
        run: |
          make -f build_system/Makefile.arm32 clean
          make -f build_system/Makefile.arm32 all
      - name: Run ARM32 in QEMU
        run: |
          timeout 30 make -f build_system/Makefile.arm32 run || true
      - name: Upload ARM32 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-arm32
          path: kernel_arm32.elf

  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make
      - name: Check every file is on Apache-2.0
        run: python3 build_system/relicense_apache.py --check
      - name: Run host tests
        run: |
          cd kernel
          make verify-all

  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: pip install clang-format==18.1.8
      - name: Check formatting of the C files this change touches
        # Style is in .clang-format. Older files predate it, so only the lines
        # a pull request or push changes are checked.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          # Only the changed lines are checked, so a one-line header edit does
          # not force a full reformat of an older file. New files are all
          # changed lines, so they stay fully checked.
          MB=$(git merge-base "$BASE" HEAD)
          out=$(git clang-format --binary "$(command -v clang-format)" --diff "$MB" HEAD -- 'kernel/*.c' 'kernel/*.h' || true)
          case "$out" in
            ""|"no modified files to format"|"clang-format did not modify any files") echo "formatting OK" ;;
            *) echo "$out"; exit 1 ;;
          esac
