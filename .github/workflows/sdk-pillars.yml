#
# Legacy-language pillars (sdk/pillars). The first is cobol-sutra: COBOL
# copybooks and Sutra over libzxv. Each job builds libzxv itself, then the
# pillar, and runs its tests against the real library:
#   pillars          unit, golden, equivalence and posting tests, a fuzz
#                    smoke run, the no-float check and the demo
#                    (ubuntu-24.04 gcc and clang, macos-14 clang)
#   pillars-sanitize the same under ASan + UBSan (gcc and clang), the
#                    mutation fuzzer at 4 x 250k inputs, libFuzzer for 60 s
#   pillars-gnucobol GnuCOBOL interop: a COBOL program CALLs libzsutra and
#                    libzxv with BY REFERENCE records, and GnuCOBOL rewrites
#                    the golden records, which must equal test/golden
# The second is fortran-trebago: the Fortran module zxv and Trebago (exact
# numeric kernels) over libzxv, in its own jobs below:
#   fortran-trebago           C and Fortran tests (conformance vectors, the
#                             fail-closed ERROR STOP test, compile-fail
#                             tests), golden programs, fuzz smoke run, demo
#                             (ubuntu-24.04 gcc and clang with gfortran,
#                             macos-14 clang with Homebrew gfortran)
#   fortran-trebago-sanitize  ASan + UBSan (gcc with gfortran; clang for the
#                             C half), the fuzzer at 4 x 250k inputs, and
#                             libFuzzer for 60 s
name: SDK pillars

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/pillars/**'
      - 'sdk/libzxv/**'
      - 'sdk/kits/z-wasm/tools/check_nofloat.py'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-pillars.yml'
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'sdk/pillars/**'
      - 'sdk/libzxv/**'
      - 'sdk/kits/z-wasm/tools/check_nofloat.py'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-pillars.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pushes run only on main and develop; pull requests run on every update and
# a newer push to the same pull request cancels the older run.
concurrency:
  group: sdk-pillars-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which pillars this run tests: on a pull request only the pillars it
  # changed, or all of them when libzxv, the kernel, the shared no-float
  # check or this workflow changed. Skipped jobs use no runner.
  changes:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: changed pillars
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ada_eve: ${{ steps.p.outputs.ada_eve }}
      apl_kron: ${{ steps.p.outputs.apl_kron }}
      cobol_sutra: ${{ steps.p.outputs.cobol_sutra }}
      fortran_trebago: ${{ steps.p.outputs.fortran_trebago }}
      mumps_myra: ${{ steps.p.outputs.mumps_myra }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: p
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all=true; changed=""
          if [ -n "$BASE" ]; then
            changed="$(git diff --name-only "$BASE" HEAD)"
            printf '%s\n' "$changed" | grep -qE '^(sdk/libzxv/|kernel/src/|kernel/third_party/|sdk/kits/z-wasm/tools/check_nofloat\.py$|\.github/workflows/sdk-pillars\.yml$)' || all=false
          fi
          for p in ada-eve apl-kron cobol-sutra fortran-trebago mumps-myra; do
            run=false
            if [ -d "sdk/pillars/$p" ] && { [ "$all" = true ] || printf '%s\n' "$changed" | grep -q "^sdk/pillars/$p/"; }; then run=true; fi
            echo "${p//-/_}=$run" | tee -a "$GITHUB_OUTPUT"
          done

  pillars:
    needs: changes
    if: needs.changes.outputs.cobol_sutra == 'true'
    name: ${{ matrix.pillar }} ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        pillar: [cobol-sutra]
        os: [ubuntu-24.04]
        cc: [gcc, clang]
        include:
          - { pillar: cobol-sutra, os: macos-14, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/${{ matrix.pillar }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: Tests, fuzz smoke run and R11 check
        run: make CC=${{ matrix.cc }} PYTHON=python test
      - name: Demo
        run: make CC=${{ matrix.cc }} PYTHON=python demo
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  pillars-sanitize:
    needs: changes
    if: needs.changes.outputs.cobol_sutra == 'true'
    name: ${{ matrix.pillar }} ASan + UBSan ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        pillar: [cobol-sutra]
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/${{ matrix.pillar }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: ASan + UBSan (pillar and tests)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python test
      - name: Mutation fuzzer under ASan + UBSan (4 x 250k inputs, 3 parsers each)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for seed in 1 2 3 4; do
            ZS_FUZZ_SEED=$seed make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python fuzz FUZZ_ITERS=250000
          done
      - name: libFuzzer, 60 s (skipped if this clang has no libFuzzer runtime)
        if: matrix.cc == 'clang'
        run: make PYTHON=python fuzz-libfuzzer

  pillars-gnucobol:
    needs: changes
    if: needs.changes.outputs.cobol_sutra == 'true'
    name: cobol-sutra GnuCOBOL interop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/cobol-sutra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version | head -1
      - run: make -C ../../libzxv all
      - name: COBOL program posts through libzsutra (cobol/PAYPOST.cbl)
        run: make PYTHON=python cobol
      - name: GnuCOBOL rewrites the golden records; they must equal test/golden
        run: make PYTHON=python golden-cobol
      - name: Golden-record tests
        run: make PYTHON=python build/test_golden && build/test_golden

  fortran-trebago:
    needs: changes
    if: needs.changes.outputs.fortran_trebago == 'true'
    name: fortran-trebago ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-14, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/fortran-trebago
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gfortran (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          echo "FC=gfortran" >> "$GITHUB_ENV"
      - name: Find Homebrew gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          fc=$(command -v gfortran || true)
          if [ -z "$fc" ]; then
            for v in 15 14 13 12; do
              if command -v gfortran-$v >/dev/null 2>&1; then fc=gfortran-$v; break; fi
            done
          fi
          if [ -z "$fc" ]; then
            brew install gcc
            fc=$(ls "$(brew --prefix)"/bin/gfortran-* | head -n 1)
          fi
          echo "FC=$fc" >> "$GITHUB_ENV"
      - run: $FC --version | head -n 1
      - run: make -C ../../libzxv all
      - name: C and Fortran tests, golden programs, fuzz smoke run, R11 checks
        run: make CC=${{ matrix.cc }} FC=$FC FORTRAN=1 PYTHON=python test
      - name: Demo
        run: make CC=${{ matrix.cc }} FC=$FC FORTRAN=1 PYTHON=python demo
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  fortran-trebago-sanitize:
    needs: changes
    if: needs.changes.outputs.fortran_trebago == 'true'
    name: fortran-trebago ASan + UBSan ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gfortran and gcc share one libasan, so the Fortran half runs
          # sanitized with gcc; with clang only the C half is sanitized
          - { cc: gcc, fortran: '1' }
          - { cc: clang, fortran: '0' }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/fortran-trebago
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - run: make -C ../../libzxv all
      - name: ASan + UBSan (library, tests and, with gcc, the Fortran modules)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make CC=${{ matrix.cc }} FC=gfortran FORTRAN=${{ matrix.fortran }} SANITIZE=1 OUT=build/san PYTHON=python test
      - name: Mutation fuzzer under ASan + UBSan (4 x 250k inputs, parse + canonical + run)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for seed in 1 2 3 4; do
            TB_FUZZ_SEED=$seed make CC=${{ matrix.cc }} FORTRAN=0 SANITIZE=1 OUT=build/san PYTHON=python fuzz FUZZ_ITERS=250000
          done
      - name: libFuzzer, 60 s (skipped if this clang has no libFuzzer runtime)
        if: matrix.cc == 'clang'
        run: make PYTHON=python fuzz-libfuzzer

  # ada-eve (sdk/pillars/ada-eve/ci-jobs.yml)
  ada-eve:
    needs: changes
    if: needs.changes.outputs.ada_eve == 'true'
    name: ada-eve ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc, ada: '1' }
          - { os: ubuntu-24.04, cc: clang, ada: '1' }
          - { os: macos-14, cc: clang, ada: '0' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/ada-eve
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GNAT (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
          gnatmake --version | head -n 1
      - run: make -C ../../libzxv all
      - name: C and Ada tests, golden scripts, GNAT comparison, fuzz smoke run, R11 checks
        run: make CC=${{ matrix.cc }} ADA=${{ matrix.ada }} PYTHON=python test
      - name: Demo
        run: make CC=${{ matrix.cc }} ADA=${{ matrix.ada }} PYTHON=python demo
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  ada-eve-sanitize:
    needs: changes
    if: needs.changes.outputs.ada_eve == 'true'
    name: ada-eve ASan + UBSan ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # GNAT and gcc share one libasan, so the Ada half runs sanitized
          # with gcc; with clang only the C half is sanitized
          - { cc: gcc, ada: '1' }
          - { cc: clang, ada: '0' }
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/ada-eve
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      - run: make -C ../../libzxv all
      - name: ASan + UBSan (library, tests and, with gcc, the Ada binding)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make CC=${{ matrix.cc }} ADA=${{ matrix.ada }} SANITIZE=1 OUT=build/san PYTHON=python test
      - name: Mutation fuzzer under ASan + UBSan (4 x 250k inputs, both front ends, printers, codecs)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for seed in 1 2 3 4; do
            ZE_FUZZ_SEED=$seed make CC=${{ matrix.cc }} ADA=0 SANITIZE=1 OUT=build/san PYTHON=python fuzz FUZZ_ITERS=250000
          done
      - name: libFuzzer, 60 s (skipped if this clang has no libFuzzer runtime)
        if: matrix.cc == 'clang'
        run: make PYTHON=python fuzz-libfuzzer

  ada-eve-prove:
    needs: changes
    if: needs.changes.outputs.ada_eve == 'true'
    name: ada-eve SPARK proof (Zxv.Fixed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/ada-eve
    steps:
      - uses: actions/checkout@v5
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat
      - name: gnatprove 14.1.1 through Alire 2.0.2
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o alr.zip https://github.com/alire-project/alire/releases/download/v2.0.2/alr-2.0.2-bin-x86_64-linux.zip
          unzip -q alr.zip -d alire
          ./alire/bin/alr -n get gnatprove=14.1.1
          echo "$PWD/$(ls -d gnatprove_14.1.1_*)/bin" >> "$GITHUB_PATH"
      - run: gnatprove --version
      - name: Prove Zxv.Fixed (level 2, every check must be proved)
        run: make prove

  # apl-kron (sdk/pillars/apl-kron/ci-jobs.yml)
  apl-kron:
    needs: changes
    if: needs.changes.outputs.apl_kron == 'true'
    name: apl-kron ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-14, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/apl-kron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: Unit, golden, equivalence and posting tests, fuzz smoke run, R11 check
        run: make CC=${{ matrix.cc }} PYTHON=python test
      - name: Demo
        run: make CC=${{ matrix.cc }} PYTHON=python demo
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  apl-kron-sanitize:
    needs: changes
    if: needs.changes.outputs.apl_kron == 'true'
    name: apl-kron ASan + UBSan ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/apl-kron
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: ASan + UBSan (library, tool and tests)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python test
      - name: Mutation fuzzer under ASan + UBSan (4 x 250k inputs, 4 spellings, parse + canonical + eval)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for seed in 1 2 3 4; do
            KR_FUZZ_SEED=$seed make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python fuzz FUZZ_ITERS=250000
          done
      - name: libFuzzer, 60 s (skipped if this clang has no libFuzzer runtime)
        if: matrix.cc == 'clang'
        run: make PYTHON=python fuzz-libfuzzer

  apl-kron-bindings:
    needs: changes
    if: needs.changes.outputs.apl_kron == 'true'
    name: apl-kron ngn/k + GNU APL bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sdk/pillars/apl-kron
    env:
      NGNK_COMMIT: b9eeb91e0343ef6029f59d55dd98f82667b9bd59
      GNUAPL_SHA256: 24bbb744fce47e62837234a053bdeecee51b9ea61c82c79f7cc191bc6a54c0a1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: Build ngn/k (pinned commit, exported symbols for 2:)
        run: |
          git init -q "$RUNNER_TEMP/ngnk"
          git -C "$RUNNER_TEMP/ngnk" fetch -q --depth 1 https://codeberg.org/ngn/k "$NGNK_COMMIT"
          git -C "$RUNNER_TEMP/ngnk" checkout -q FETCH_HEAD
          make -C "$RUNNER_TEMP/ngnk" a N=k R=k O='-O2' L='-lm -ldl -Wl,-E' CC=clang
          printf '`0:$1+1\n' > "$RUNNER_TEMP/one.k"
          "$RUNNER_TEMP/ngnk/k" "$RUNNER_TEMP/one.k"
      - name: Build GNU APL 2.0 (checksum pinned)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o apl-2.0.tar.gz https://ftp.gnu.org/gnu/apl/apl-2.0.tar.gz
          echo "$GNUAPL_SHA256  apl-2.0.tar.gz" | sha256sum -c -
          tar xzf apl-2.0.tar.gz
          cd apl-2.0
          ./configure --prefix="$RUNNER_TEMP/gnuapl" > configure.log
          make -j"$(nproc)" > make.log
          make install > install.log
      - name: ngn/k binding (values, refusals, 31 programs compared with ngn/k itself)
        run: make PYTHON=python NGNK="$RUNNER_TEMP/ngnk/k" NGNK_SRC="$RUNNER_TEMP/ngnk" bindings-k
      - name: GNU APL binding (values, errors, 42 programs compared with GNU APL itself)
        run: make PYTHON=python GNUAPL="$RUNNER_TEMP/gnuapl/bin/apl" GNUAPL_SRC="$RUNNER_TEMP/apl-2.0" bindings-apl
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # mumps-myra (sdk/pillars/mumps-myra/ci-jobs.yml)
  mumps-myra:
    needs: changes
    if: needs.changes.outputs.mumps_myra == 'true'
    name: mumps-myra ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-14, cc: clang }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/pillars/mumps-myra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: Unit, golden, collation and posting tests, fuzz smoke run, R11 check
        run: make CC=${{ matrix.cc }} PYTHON=python test
      - name: Demo
        run: make CC=${{ matrix.cc }} PYTHON=python demo
      - name: Build output stays out of git
        working-directory: .
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  mumps-myra-sanitize:
    needs: changes
    if: needs.changes.outputs.mumps_myra == 'true'
    name: mumps-myra ASan + UBSan ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/mumps-myra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all
      - name: ASan + UBSan (library, tool and tests)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python test
      - name: Mutation fuzzer under ASan + UBSan (4 x 250k inputs, 3 parsers + codec each)
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          for seed in 1 2 3 4; do
            ZM_FUZZ_SEED=$seed make CC=${{ matrix.cc }} SANITIZE=1 OUT=build/san PYTHON=python fuzz FUZZ_ITERS=250000
          done
      - name: libFuzzer, 60 s (skipped if this clang has no libFuzzer runtime)
        if: matrix.cc == 'clang'
        run: make PYTHON=python fuzz-libfuzzer

  mumps-myra-gtm:
    needs: changes
    if: needs.changes.outputs.mumps_myra == 'true'
    name: mumps-myra GT.M interop
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdk/pillars/mumps-myra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install GT.M (Ubuntu's fis-gtm package)
        run: |
          sudo apt-get update
          sudo apt-get install -y fis-gtm
          ls -d /usr/lib/x86_64-linux-gnu/fis-gtm/V*_x86_64
      - run: make -C ../../libzxv all
      - name: M routine posts a real global through libzmyra; GT.M cross-checks collation, numbers and dates
        run: make PYTHON=python m
      - name: Golden-file tests (the files GT.M just matched)
        run: make PYTHON=python build/test_golden && build/test_golden
