# Framework kits (sdk/frameworks): the Spring Boot starter over sdk/java,
# Zxv.AspNetCore over sdk/dotnet, @zedec/zxv-nestjs over sdk/typescript and
# django-zxv over sdk/python. Each job builds libzxv itself, then the
# SDK it wraps, then the kit, and runs the kit's integration tests against
# the real library.
name: SDK frameworks

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'sdk/libzxv/**'
      - '.github/workflows/sdk-frameworks.yml'
      - 'build_system/sdk_kernel_deps.py'
      # kernel inputs of libzxv: build_system/sdk_kernel_deps.py --write
      - 'kernel/src/abacus/**'
      - 'kernel/src/aipi/**'
      - 'kernel/src/cardnet/**'
      - 'kernel/src/cbank/**'
      - 'kernel/src/e8/**'
      - 'kernel/src/edp_risk/**'
      - 'kernel/src/engine/**'
      - 'kernel/src/event_space/**'
      - 'kernel/src/finance/**'
      - 'kernel/src/freight/**'
      - 'kernel/src/harmonic/**'
      - 'kernel/src/hwemu/**'
      - 'kernel/src/ipfs_node/**'
      - 'kernel/src/iso20022/**'
      - 'kernel/src/lpres/**'
      - 'kernel/src/mlkem/**'
      - 'kernel/src/modbind/**'
      - 'kernel/src/onepolicy/**'
      - 'kernel/src/paradox/**'
      - 'kernel/src/pay/**'
      - 'kernel/src/phase_coord/**'
      - 'kernel/src/pqsec/**'
      - 'kernel/src/rational/**'
      - 'kernel/src/rmag/**'
      - 'kernel/src/robin_debanks/**'
      - 'kernel/src/surplus/**'
      - 'kernel/src/swarm/**'
      - 'kernel/src/tensor/**'
      - 'kernel/src/tls/**'
      - 'kernel/src/treaty/**'
      - 'kernel/src/trispace/**'
      - 'kernel/src/ubh/**'
      - 'kernel/src/vhub/**'
      - 'kernel/src/vino/**'
      - 'kernel/src/vino_stores/**'
      - 'kernel/src/web4/**'
      - 'kernel/src/zcapital/**'
      - 'kernel/include/**'
      - 'kernel/third_party/**'
      # end of the kernel inputs of libzxv
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'sdk/libzxv/**'
      - '.github/workflows/sdk-frameworks.yml'
      - 'build_system/sdk_kernel_deps.py'
      # kernel inputs of libzxv: build_system/sdk_kernel_deps.py --write
      - 'kernel/src/abacus/**'
      - 'kernel/src/aipi/**'
      - 'kernel/src/cardnet/**'
      - 'kernel/src/cbank/**'
      - 'kernel/src/e8/**'
      - 'kernel/src/edp_risk/**'
      - 'kernel/src/engine/**'
      - 'kernel/src/event_space/**'
      - 'kernel/src/finance/**'
      - 'kernel/src/freight/**'
      - 'kernel/src/harmonic/**'
      - 'kernel/src/hwemu/**'
      - 'kernel/src/ipfs_node/**'
      - 'kernel/src/iso20022/**'
      - 'kernel/src/lpres/**'
      - 'kernel/src/mlkem/**'
      - 'kernel/src/modbind/**'
      - 'kernel/src/onepolicy/**'
      - 'kernel/src/paradox/**'
      - 'kernel/src/pay/**'
      - 'kernel/src/phase_coord/**'
      - 'kernel/src/pqsec/**'
      - 'kernel/src/rational/**'
      - 'kernel/src/rmag/**'
      - 'kernel/src/robin_debanks/**'
      - 'kernel/src/surplus/**'
      - 'kernel/src/swarm/**'
      - 'kernel/src/tensor/**'
      - 'kernel/src/tls/**'
      - 'kernel/src/treaty/**'
      - 'kernel/src/trispace/**'
      - 'kernel/src/ubh/**'
      - 'kernel/src/vhub/**'
      - 'kernel/src/vino/**'
      - 'kernel/src/vino_stores/**'
      - 'kernel/src/web4/**'
      - 'kernel/src/zcapital/**'
      - 'kernel/include/**'
      - 'kernel/third_party/**'
      # end of the kernel inputs of libzxv
  workflow_dispatch:

permissions:
  contents: read

# Pushes run only on main and develop; pull requests run on every update and
# a newer push to the same pull request cancels the older run.
concurrency:
  group: sdk-frameworks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: spring ${{ matrix.os }} jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/spring-zxv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: make -C ../../libzxv all fixtures
      - name: Install the Java SDK (org.zedec:zxv) into the local repository
        run: mvn -B -f ../../java/pom.xml install -DskipTests
      - name: Build (javac -Xlint:all, failOnWarning) and test
        run: mvn -B clean verify

  aspnetcore:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: aspnetcore ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/aspnetcore-zxv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: make -C ../../libzxv all fixtures
      - name: Build (Release, warnings as errors)
        run: dotnet build Zxv.AspNetCore.sln -c Release -p:ZxvSkipNativeBuild=true
      - run: dotnet test Zxv.AspNetCore.sln -c Release --no-build

  nest:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: nest ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/nest-zxv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all fixtures
      - name: Build the TypeScript SDK (@zedec/zxv, Node-API backend)
        run: |
          cd ../../typescript
          npm ci
          npm run build:ts
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - run: npm test

  django:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}  # drafts: fast tier only (docs/CI.md)
    name: django ${{ matrix.os }} py${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        py: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/django-zxv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
      - run: make -C ../../libzxv all fixtures
      - name: Install the Python SDK, the kit and the pinned tools
        run: python -m pip install -e ../../python -e . -r requirements-dev.txt
      - name: Test (Django's test runner)
        run: python runtests.py -v 2
      - name: Type-check (mypy --strict, django-stubs)
        run: python -m mypy
