# Framework kits (sdk/frameworks): the Spring Boot starter over sdk/java,
# Zxv.AspNetCore over sdk/dotnet, @zedec/zxv-nestjs over sdk/typescript and
# django-zxv over sdk/python. Each job builds libzxv itself, then the
# SDK it wraps, then the kit, and runs the kit's integration tests against
# the real library.
name: SDK frameworks

on:
  push:
    branches: [main, develop]
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'sdk/libzxv/**'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-frameworks.yml'
  pull_request:
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/typescript/**'
      - 'sdk/python/**'
      - 'sdk/libzxv/**'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-frameworks.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pushes run only on main and develop; pull requests run on every update and
# a newer push to the same pull request cancels the older run.
concurrency:
  group: sdk-frameworks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring:
    name: spring ${{ matrix.os }} jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/spring-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: make -C ../../libzxv all fixtures
      - name: Install the Java SDK (org.zedec:zxv) into the local repository
        run: mvn -B -f ../../java/pom.xml install -DskipTests
      - name: Build (javac -Xlint:all, failOnWarning) and test
        run: mvn -B clean verify

  aspnetcore:
    name: aspnetcore ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/aspnetcore-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: make -C ../../libzxv all fixtures
      - name: Build (Release, warnings as errors)
        run: dotnet build Zxv.AspNetCore.sln -c Release -p:ZxvSkipNativeBuild=true
      - run: dotnet test Zxv.AspNetCore.sln -c Release --no-build

  nest:
    name: nest ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/nest-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../../libzxv all fixtures
      - name: Build the TypeScript SDK (@zedec/zxv, Node-API backend)
        run: |
          cd ../../typescript
          npm ci
          npm run build:ts
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - run: npm test

  django:
    name: django ${{ matrix.os }} py${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        py: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdk/frameworks/django-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - run: make -C ../../libzxv all fixtures
      - name: Install the Python SDK, the kit and the pinned tools
        run: python -m pip install -e ../../python -e . -r requirements-dev.txt
      - name: Test (Django's test runner)
        run: python runtests.py -v 2
      - name: Type-check (mypy --strict, django-stubs)
        run: python -m mypy
