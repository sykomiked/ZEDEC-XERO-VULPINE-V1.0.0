# ----------------------------------------------------------------------------
# WHAT "100%" MEANS — the completion metrics, each with a measurable test
# ----------------------------------------------------------------------------
completeness_metrics:
  - metric: test_coverage_of_shipping_code
    now: "~30 of 81 in-kernel modules confidently gated"
    hundred_percent: "every module compiled into the kernel has a gated test
                      asserting real values"
    measure: "the inventory script in this file, re-run"
  - metric: build_hygiene
    now: "0 warnings, not -Werror enforced"
    hundred_percent: "-Werror on host and both cross targets; CI fails on any warning"
  - metric: boot_reliability
    now: "100/100 ARM64"
    hundred_percent: "100/100 on ARM64 AND x86-64 from one commit"
  - metric: cross_isa_parity
    now: "ARM64 complete; x86-64 bootstrap only"
    hundred_percent: "identical acceptance suite passes on both; identical
                      13-phase semantic trace hash"
  - metric: security_posture
    now: "red-team passed (19 findings fixed); 5 structural P0s open"
    hundred_percent: "A1-A5 closed; syscall + package fuzzing >=1M cases each;
                      0 open critical/high findings"
  - metric: post_quantum
    now: "ML-KEM host-validated, NOT in the kernel"
    hundred_percent: "compiled in, a real operation routed through it, on-target KAT"
  - metric: durability
    now: "Chronicle survives power loss; ZXVFS journal replays"
    hundred_percent: ">=10,000 randomized power-cut runs across install + update
                      + transaction, zero unrecoverable"
  - metric: reproducibility
    now: "same-host deterministic"
    hundred_percent: "two independent hosts produce bit-identical artifacts"
  - metric: evidence_integrity
    now: "provenance/SBOM stale vs current build"
    hundred_percent: "capsule generated from one signed commit; packaging FAILS
                      on any stale hash or claim; 0 secrets in the artifact"
  - metric: architectural_honesty
    now: "claims corrected in-tree; no claim ledger yet"
    hundred_percent: "every external claim tagged and evidence-linked"

# ----------------------------------------------------------------------------
# SERVER INTEGRATION PLAN — ordered so each step unblocks the next
# ----------------------------------------------------------------------------
server_integration_plan:
  - step: 1
    action: "provision + reproduce the baseline (736 / 0 warnings / boot)"
    script: "build_system/provision_server.sh then build_system/session_build.sh"
    why: "never build on an unverified environment"
  - step: 2
    action: "wire the ~12 already-written-but-ungated tests into verify-all"
    why: "immediate coverage gain, pure integration, no new code"
    integration_point: "kernel/Makefile :: verify-all"
  - step: 3
    action: "integrate mlkem into KERNEL_SRCS + route one real operation through it"
    why: "closes GAP-PQ; the post-quantum property becomes real"
  - step: 4
    action: "fix the virtio-net probe; prove a frame moves"
    why: "keystone — unblocks L4, L5, L6 networking, Holodeck"
  - step: 5
    action: "network stack -> DHCP, DNS, TCP, TLS 1.3"
  - step: 6
    action: "x86-64 parity (Makefile.x86_64 exists; bring the modern stack over)"
    why: "MVP gate; easier on Linux than macOS"
  - step: 7
    action: "clean-room reproducibility: two hosts, identical hashes"
  - step: 8
    action: "long soak: 100+ boots, heavy ELF/ZXVFS fuzzing under sanitizers"
  - step: 9
    action: "resolve the 7 header-only stubs — implement or delete"
    why: "the architecture must not declare what it does not have"
