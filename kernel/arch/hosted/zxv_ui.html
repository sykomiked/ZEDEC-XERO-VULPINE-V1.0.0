/* ASCW-GOLDEN:END */
:root{--bg:#0e1116;--panel:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--accent:#d4a72c;--ok:#3fb950;--bad:#f85149;--glut:#a371f7;--re:#4c8dff;--mk:#d4a72c;--im:#db61a2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "ZXV UI",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;letter-spacing:.04em}
header .sub{color:var(--muted);font-size:12px}
header button{margin-left:auto;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.note{margin:12px 16px 0;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;color:var(--muted);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;padding:12px 16px}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
section h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted)}
.harm{display:flex;gap:6px;flex-wrap:wrap}
.harm div{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);transition:background .15s}
.harm div.on{background:var(--accent);color:#000}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.bar{display:flex;height:8px;min-width:120px;border-radius:4px;overflow:hidden;background:#0b0e13}
.bar i{display:block}
.v1{color:var(--ok)}.v0{color:var(--bad)}.v2{color:var(--glut)}
#chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin-bottom:8px}
.msg{padding:8px 10px;border-radius:8px;background:#0b0e13;white-space:pre-wrap;word-break:break-word}
.msg.you{border:1px solid var(--line)}
.msg .who{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;background:#0b0e13;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px}
form button{background:var(--accent);color:#000;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.btns{display:flex;gap:6px;margin-top:8px}
.btns button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.btns button.on{background:var(--accent);color:#000;border-color:var(--accent)}
.small{font-size:12px;color:var(--muted);margin-top:6px}
#notes div{padding:4px 0;border-bottom:1px solid var(--line);font-size:12px}
#notes div.unread{border-left:3px solid var(--accent);padding-left:6px}
/* the app shell: a sidebar of staple apps, one view at a time */
.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:calc(100vh - 53px)}
#dock{border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
#dock .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 8px 4px}
#dock .grp:first-child{margin-top:2px}
#dock button{display:flex;align-items:center;gap:8px;text-align:left;background:transparent;color:var(--text);border:0;border-radius:6px;padding:7px 8px;cursor:pointer;font:inherit}
#dock button:hover{background:var(--panel)}
#dock button.on{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
#dock button i{font-style:normal;width:18px;text-align:center}
.view{display:none;min-width:0}
.view.on{display:block}
.pad{padding:12px 16px}
@media (max-width:720px){.shell{display:block;min-height:0}#dock{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;border-right:0;border-bottom:1px solid var(--line)}#dock .grp{display:none}#dock button{padding:6px 8px}table.ft th:nth-child(3),table.ft td:nth-child(3){display:none}table.ft td.acts{white-space:normal}}
.bar2{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.bar2 button,.btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.bar2 button:hover,.btn:hover{border-color:var(--muted)}
.bar2 button.primary,.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.bar2 button:disabled{opacity:.45;cursor:default}
.bar2 .sp{flex:1}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px}
.crumbs a{color:var(--text);cursor:pointer;padding:2px 4px;border-radius:4px;text-decoration:none}
.crumbs a:hover{background:var(--panel)}
.crumbs span{color:var(--muted)}
table.ft td,table.ft th{text-align:left}
table.ft td.num,table.ft th.num{text-align:right}
table.ft tr.row{cursor:default}
table.ft tr.row:hover td{background:#11161d}
table.ft tr.sel td{background:#1d2633}
table.ft td.nm{white-space:normal;word-break:break-word}
table.ft td.acts{text-align:right}

<script id="zxv-i18n-core">
// The page's side of kernel/src/i18n: locale negotiation over the table's
// map (built and checked against i18n_locale_resolve by gen_ui_strings.c),
// i18n_format_msg's {0}..{9} substitution with FSI/PDI isolation, and
// i18n_fmt_int/i18n_fmt_decimal over the CLDR decimal format. No DOM here:
// check_ui_i18n.py runs this script under node against the C results.
const ZXVI18N=(()=>{
  const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  function norm(tag){
    let t=String(tag==null?'':tag).slice(0,47).replace(/_/g,'-').replace(/[A-Z]/g,c=>c.toLowerCase());
    for(let i=0;i+2<t.length;i++)if(t[i]==='-'&&t[i+2]==='-'){t=t.slice(0,i);break}
    if(t.length>=2&&t[t.length-2]==='-')t=t.slice(0,-2);
    return t;
  }
  function negotiate(tb,tag){
    let t=norm(tag);
    for(;;){
      if(t&&own(tb.map,t))return tb.map[t];
      const k=t.lastIndexOf('-');
      if(k<0)return tb.def;
      t=t.slice(0,k);
    }
  }
  function strongRtl(cp){
    return (cp>=0x0590&&cp<=0x08FF)||(cp>=0xFB1D&&cp<=0xFDFF)||(cp>=0xFE70&&cp<=0xFEFF)||
           (cp>=0x10800&&cp<=0x10FFF)||(cp>=0x1E800&&cp<=0x1EFFF);
  }
  function hasRtl(s){for(const ch of s)if(strongRtl(ch.codePointAt(0)))return true;return false}
  function format(rtl,tmpl,args){
    let o='';
    for(let i=0;i<tmpl.length;i++){
      const c=tmpl[i],d=tmpl[i+1];
      if(c==='{'&&d>='0'&&d<='9'&&tmpl[i+2]==='}'){
        const k=d.charCodeAt(0)-48,a=k<args.length&&args[k]!=null?String(args[k]):'';
        const iso=rtl||hasRtl(a);
        o+=(iso?'⁨':'')+a+(iso?'⁩':'');
        i+=2;continue;
      }
      o+=c;
    }
    return o;
  }
  function body(nf,mag,frac){
    let s=mag.toString();
    if(frac>19)frac=19;
    while(s.length<=frac)s='0'+s;
    const ni=s.length-frac,grouping=nf.g1>0&&ni>=nf.g1+nf.min;
    let o='';
    for(let k=0;k<ni;k++){
      o+=nf.d[s.charCodeAt(k)-48];
      const left=ni-1-k;
      if(grouping&&left>0&&(left===nf.g1||(left>nf.g1&&nf.g2>0&&(left-nf.g1)%nf.g2===0)))o+=nf.grp;
    }
    if(frac){o+=nf.dec;for(let k=ni;k<s.length;k++)o+=nf.d[s.charCodeAt(k)-48]}
    return o;
  }
  function big(v){
    if(typeof v==='bigint')return v;
    if(typeof v==='string'&&/^-?[0-9]+$/.test(v))return BigInt(v);
    const n=Number(v);
    return Number.isFinite(n)?BigInt(Math.round(n)):null;
  }
  // value = scaled / 10^frac, every digit shown, no rounding (i18n.h)
  function fmtNum(nf,v,frac){
    const b=big(v);
    if(b===null)return String(Number(v));
    const neg=b<0n;
    return (neg?nf.np:nf.pp)+body(nf,neg?-b:b,frac)+(neg?nf.ns:nf.ps);
  }
  function make(tb,tag){
    const L=tb.locs[negotiate(tb,tag)],set=tb.sets[L[3]],nf=tb.nums[L[4]],rtl=!!L[2],idx={};
    tb.keys.forEach((k,i)=>{idx[k]=i});
    function entry(key){
      const i=idx[key];
      if(i===undefined)throw new Error(key);
      const e=set[i];
      return e?{s:e[0],review:e[1],fb:false}:{s:tb.en[i],review:0,fb:!!L[5]};
    }
    const all=tb.keys.map(entry);
    // English fallback text in a right-to-left window keeps its own
    // direction: isolated left to right (LRI .. PDI)
    function T(key,...a){
      const e=entry(key),s=a.length?format(rtl,e.s,a):e.s;
      return rtl&&e.fb?'⁦'+s+'⁩':s;
    }
    return {tag:L[0],autonym:L[1],rtl,entry,T,
      fallback:all.some(e=>e.fb),machine:all.some(e=>e.review===2),
      n:v=>fmtNum(nf,v,0),d:(scaled,frac)=>fmtNum(nf,scaled,frac)};
  }
  return {norm,negotiate,format,fmtNum,make};
})();
</script>

<script>
const $=id=>document.getElementById(id);
const I18N=ZXVI18N.make(JSON.parse($('zxv-i18n').textContent),navigator.language||'');
const T=I18N.T,fmt=I18N.n;
document.documentElement.lang=I18N.tag;
if(I18N.rtl)document.documentElement.dir='rtl';
document.querySelectorAll('[data-i18n]').forEach(e=>{const x=I18N.entry(e.dataset.i18n);e.textContent=x.s;if(x.fb){e.lang='en';if(I18N.rtl)e.dir='ltr'}});

let rpcSeq=0;
async function rpc(method,params){
  let r;
  try{r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++rpcSeq,method,params:params||{}})})}
  catch(e){throw new Error(T('UI_RPC_NO_CONNECTION'))}
  if(r.status===404)throw new Error(T('UI_RPC_NO_ZXVD'));
  if(!r.ok)throw new Error(T('UI_RPC_REFUSED',r.status));
  const j=await r.json();
  if(j.error)throw new Error(j.error.message);
  return j.result;
}

/* chunked file I/O: one request stays under zxvd's line limit */
const enc=new TextEncoder();
async function readAll(path,binary){
  let off=0,parts=[];
  for(;;){const r=await rpc('files.read',{path,offset:off,encoding:binary?'base64':'utf8'});
    parts.push(binary?r.base64:r.text);if(r.eof||r.next===off)break;off=r.next}
  if(!binary)return parts.join('');
  const out=[];for(const b of parts){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);out.push(u)}
  return out;
}
async function writeText(path,text,exclusive){
  const pieces=[];let i=0;
  while(i<text.length){let n=Math.min(4096,text.length-i);
    if(n<text.length-i&&text.charCodeAt(i+n-1)>=0xd800&&text.charCodeAt(i+n-1)<0xdc00)n--;
    let piece=text.slice(i,i+n);
    while(enc.encode(JSON.stringify(piece)).length>12000&&n>1){n=n>>1;if(text.charCodeAt(i+n-1)>=0xd800&&text.charCodeAt(i+n-1)<0xdc00)n--;piece=text.slice(i,i+n)}
    pieces.push(piece);i+=n}
  if(pieces.length<=1)return rpc('files.write',{path,text:pieces[0]||'',exclusive:!!exclusive});
  for(let k=0;k<pieces.length;k++)await rpc('files.write',{path,text:pieces[k],exclusive:!!exclusive,mode:k===0?'begin':k===pieces.length-1?'end':'add'});
}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
async function writeBytes(path,u8,progress){
  const C=9000;const n=Math.max(1,Math.ceil(u8.length/C));
  for(let k=0;k<n;k++){const part=b64(u8.subarray(k*C,(k+1)*C));
    await rpc('files.write',{path,base64:part,exclusive:true,mode:n===1?'replace':k===0?'begin':k===n-1?'end':'add'});
    if(progress)progress(k+1,n)}
}
async function importFiles(dir,list,stEl,done){
  let ok=0;
  for(const f of list){
    try{const u8=new Uint8Array(await f.arrayBuffer());
      await writeBytes(join(dir,f.name),u8,(k,n)=>status(stEl,T('UI_IMPORTING',f.name,fmt(Math.round(k/n*100)))));ok++}
    catch(e){status(stEl,T('UI_NAME_ERROR',f.name,e.message),true);if(done)done();return}}
  status(stEl,(ok===1?T('UI_IMPORTED_ONE',fmt(ok)):T('UI_IMPORTED_N',fmt(ok))));if(done)done();
}

  async load(dir){if(dir!==undefined)F.dir=dir;const inTrash=F.dir==='.Trash'||F.dir.startsWith('.Trash/');
    F.crumbs($('fcrumbs'),F.dir,d=>F.load(d));
    $('fempty').style.display=inTrash?'':'none';$('ftrash').textContent=inTrash?T('UI_FILES_BACK'):T('UI_FILES_TRASH');
    ['fnewdir','fnewtxt','fimport'].forEach(id=>$(id).disabled=inTrash);
    try{const r=await rpc('files.list',{path:F.dir});F.entries=r.entries;F.render(inTrash);
      if(!F.root){const x=await rpc('files.root');F.root=x.root}
      status($('fstat'),(r.entries.length===1?T('UI_FILES_STAT_ONE',fmt(r.entries.length),F.root,F.host||T('UI_HOST_LOCAL')):T('UI_FILES_STAT_N',fmt(r.entries.length),F.root,F.host||T('UI_HOST_LOCAL'))))}
    catch(e){$('flist').innerHTML='';status($('fstat'),e.message,true)}},
  render(inTrash){const tb=$('flist');tb.innerHTML='';
    if(!F.entries.length){tb.innerHTML=`<tr><td colspan="4" class="empty">${esc(inTrash?T('UI_FILES_TRASH_EMPTY'):T('UI_FILES_EMPTY'))}</td></tr>`;return}
    for(const e of F.entries){const tr=document.createElement('tr');tr.className='row';const p=join(F.dir,e.name);
      tr.innerHTML=`<td class="nm">${icon(e)} ${esc(e.name)}</td><td class="num">${e.dir?'–':size(e.size)}</td><td>${esc(when(e.mtime))}</td><td class="acts"></td>`;
      const acts=tr.lastChild;const btn=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=ev=>{ev.stopPropagation();fn()};acts.appendChild(b)};
      if(inTrash){btn(T('UI_FILES_PUT_BACK'),()=>F.restore(p,e.name));btn(T('UI_FILES_DELETE_NOW'),()=>F.remove(p,e.name))}
      else{btn(T('UI_FILES_OPEN'),()=>F.open(p,e));btn(T('UI_FILES_RENAME'),()=>F.rename(p,e.name));btn(T('UI_FILES_MOVE_TRASH'),()=>F.trash(p))}
      tr.ondblclick=()=>inTrash?null:F.open(p,e);tb.appendChild(tr)}},
  open(p,e){if(e.dir)return F.load(p);const k=kindOf(e.name);
    if(k==='image'||k==='audio'||k==='video'){P.dir=parent(p);P.openPath(p);return}
    Q.open(p)},
  async rename(p,name){const n=await ask(T('UI_FILES_RENAME'),null,name,T('UI_FILES_RENAME'));if(!n||n===name)return;
    try{await rpc('files.rename',{from:p,to:join(parent(p),n)});F.load()}catch(e){status($('fstat'),e.message,true)}},
  async trash(p){try{await rpc('files.trash',{path:p});F.load()}catch(e){status($('fstat'),e.message,true)}},
  async restore(p,name){const to=await ask(T('UI_FILES_PUT_BACK'),T('UI_FILES_PUT_BACK_HINT'),name,T('UI_FILES_PUT_BACK'));if(!to)return;
    try{await rpc('files.rename',{from:p,to});F.load()}catch(e){status($('fstat'),e.message,true)}},
  async remove(p,name){if(!await confirmBox(T('UI_FILES_DELETE_Q'),T('UI_FILES_DELETE_TEXT',name),T('UI_FILES_DELETE')))return;
    try{await rpc('files.trash',{path:p});F.load()}catch(e){status($('fstat'),e.message,true)}},
};
$('ftrash').onclick=()=>F.load(F.dir.startsWith('.Trash')?'':'.Trash');
$('fempty').onclick=async()=>{if(!await confirmBox(T('UI_FILES_EMPTY_Q'),T('UI_FILES_EMPTY_TEXT'),T('UI_FILES_EMPTY_TRASH')))return;
  try{const r=await rpc('files.empty_trash');status($('fstat'),(r.removed===1?T('UI_FILES_REMOVED_ONE',fmt(r.removed)):T('UI_FILES_REMOVED_N',fmt(r.removed))));F.load()}catch(e){status($('fstat'),e.message,true)}};
$('fnewdir').onclick=async()=>{const n=await ask(T('UI_FILES_NEW_FOLDER'),null,T('UI_FILES_NEW_FOLDER_NAME'),T('UI_CREATE'));if(!n)return;
  try{await rpc('files.mkdir',{path:join(F.dir,n)});F.load()}catch(e){status($('fstat'),e.message,true)}};
$('fnewtxt').onclick=async()=>{const n=await ask(T('UI_FILES_NEW_TEXT'),null,T('UI_TEXT_UNTITLED_FILE'),T('UI_CREATE'));if(!n)return;
  try{await rpc('files.write',{path:join(F.dir,n),text:'',exclusive:true});Q.open(join(F.dir,n))}catch(e){status($('fstat'),e.message,true)}};
$('fimport').onclick=()=>$('fpick').click();
$('fpick').onchange=()=>{const l=[...$('fpick').files];$('fpick').value='';importFiles(F.dir,l,$('fstat'),()=>F.load())};
$('fdrop').ondragover=e=>{if(F.dir.startsWith('.Trash'))return;e.preventDefault();$('fdrop').classList.add('drop')};
$('fdrop').ondragleave=()=>$('fdrop').classList.remove('drop');
$('fdrop').ondrop=e=>{e.preventDefault();$('fdrop').classList.remove('drop');if(F.dir.startsWith('.Trash'))return;importFiles(F.dir,[...e.dataTransfer.files],$('fstat'),()=>F.load())};

/* ----- Quillon (text) ----- */
const Q={path:null,saved:'',preview:false,
  dirty(){return $('ed').value!==Q.saved},
  mark(){$('tname').textContent=Q.path?base(Q.path):T('UI_TEXT_UNTITLED');$('tname').title=Q.path||'';$('tdirty').textContent=Q.dirty()?' '+T('UI_TEXT_EDITED'):'';
    const v=$('ed').value;const words=(v.match(/\S+/g)||[]).length;
    const nl=v?v.split('\n').length:0;
    status($('tstat'),[(words===1?T('UI_TEXT_WORDS_ONE',fmt(words)):T('UI_TEXT_WORDS_N',fmt(words))),(v.length===1?T('UI_TEXT_CHARS_ONE',fmt(v.length)):T('UI_TEXT_CHARS_N',fmt(v.length))),(nl===1?T('UI_TEXT_LINES_ONE',fmt(nl)):T('UI_TEXT_LINES_N',fmt(nl)))].concat(Q.path?[T('UI_TEXT_ZXV_PATH',Q.path)]:[]).join(' · '));
    if(Q.preview)$('mdview').innerHTML=md(v);
    try{if(Q.dirty())localStorage.setItem('zxv-draft',JSON.stringify({path:Q.path,text:v,saved:Q.saved}));else localStorage.removeItem('zxv-draft')}catch(e){}},
  async guard(){if(!Q.dirty())return true;return !!await confirmBox(T('UI_TEXT_DISCARD_Q'),T('UI_TEXT_DISCARD_TEXT',Q.path?base(Q.path):T('UI_TEXT_UNTITLED')),T('UI_PLAY_DISCARD'))},
  async open(p){if(!await Q.guard())return;show('text');status($('tstat'),T('UI_TEXT_OPENING'));
    try{const t=await readAll(p,false);Q.path=p;Q.saved=t;$('ed').value=t;Q.mark()}
    catch(e){status($('tstat'),T('UI_NAME_ERROR',base(p),e.message),true)}},
  async save(as){let p=Q.path;
    if(!p||as){const n=await ask(as?T('UI_TEXT_SAVE_AS_TITLE'):T('UI_TEXT_SAVE'),T('UI_TEXT_SAVE_HINT'),p||T('UI_TEXT_UNTITLED_FILE'),T('UI_TEXT_SAVE'));if(!n)return false;p=n}
    const v=$('ed').value;status($('tstat'),T('UI_TEXT_SAVING'));
    try{await writeText(p,v,false);Q.path=p;Q.saved=v;Q.mark();status($('tstat'),T('UI_TEXT_SAVED',p));return true}
    catch(e){status($('tstat'),e.message,true);return false}},
};
$('ed').oninput=()=>Q.mark();
$('ed').onkeydown=e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();Q.save(e.shiftKey)}
  if(e.key==='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();const el=$('ed'),a=el.selectionStart;el.setRangeText('\t',a,el.selectionEnd,'end');Q.mark()}};
$('tnew').onclick=async()=>{if(!await Q.guard())return;Q.path=null;Q.saved='';$('ed').value='';Q.mark();$('ed').focus()};
$('topen').onclick=()=>{show('files')};
$('tsave').onclick=()=>Q.save(false);$('tsaveas').onclick=()=>Q.save(true);
$('tprev').onclick=()=>{Q.preview=!Q.preview;$('mdview').style.display=Q.preview?'':'none';$('twrap').classList.toggle('split',Q.preview);$('tprev').classList.toggle('primary',Q.preview);Q.mark()};
$('tfont').onclick=()=>{$('ed').classList.toggle('prose');$('tfont').textContent=$('ed').classList.contains('prose')?T('UI_TEXT_CODE'):T('UI_TEXT_PROSE')};
/* Markdown preview: escaped first, then a small safe subset (no raw HTML, no links followed) */
function md(src){const lines=esc(src).split('\n');let out='',inCode=false,list='';
  const inline=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<u title="$2">$1</u>');
  const close=()=>{if(list){out+=`</${list}>`;list=''}};
  for(const l of lines){
    if(/^```/.test(l)){close();out+=inCode?'</pre>':'<pre>';inCode=!inCode;continue}
    if(inCode){out+=l+'\n';continue}
    let m;
    if((m=/^(#{1,6})\s+(.*)$/.exec(l))){close();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`}
    else if((m=/^\s*[-*+]\s+(.*)$/.exec(l))){if(list!=='ul'){close();out+='<ul>';list='ul'}out+=`<li>${inline(m[1])}</li>`}
    else if((m=/^\s*\d+[.)]\s+(.*)$/.exec(l))){if(list!=='ol'){close();out+='<ol>';list='ol'}out+=`<li>${inline(m[1])}</li>`}
    else if(/^&#62;\s?/.test(l)){close();out+=`<blockquote>${inline(l.replace(/^&#62;\s?/,''))}</blockquote>`}
    else if(/^\s*$/.test(l)){close()}
    else{close();out+=`<p>${inline(l)}</p>`}}
  close();if(inCode)out+='</pre>';return out}
try{const d=JSON.parse(localStorage.getItem('zxv-draft')||'null');if(d&&typeof d.text==='string'){Q.path=d.path||null;Q.saved=typeof d.saved==='string'?d.saved:'';$('ed').value=d.text}}catch(e){}
Q.mark();
window.addEventListener('beforeunload',e=>{if(Q.dirty()){e.preventDefault();e.returnValue=''}});

/* ----- Glint (photos and media) ----- */
const P={dir:'',items:[],urls:new Map(),idx:-1,
  async load(dir){if(dir!==undefined)P.dir=dir;F.crumbs($('pcrumbs'),P.dir,d=>P.load(d));
    try{const r=await rpc('files.list',{path:P.dir});const g=$('pgrid');g.innerHTML='';
      const dirs=r.entries.filter(e=>e.dir);P.items=r.entries.filter(e=>!e.dir&&['image','audio','video'].includes(kindOf(e.name)));
      for(const e of dirs){const t=P.tile('📁',e.name);t.onclick=()=>P.load(join(P.dir,e.name));g.appendChild(t)}
      P.items.forEach((e,i)=>{const k=kindOf(e.name);const t=P.tile(k==='image'?'🖼':k==='audio'?'♪':'▶',e.name);t.onclick=()=>P.view(i);g.appendChild(t);
        if(k==='image'&&e.size<=8*1048576)P.thumb(join(P.dir,e.name),t.firstChild)});
      status($('pstat'),P.items.length?(P.items.length===1?T('UI_PHOTOS_ONE',fmt(P.items.length)):T('UI_PHOTOS_N',fmt(P.items.length))):T('UI_PHOTOS_NONE'))}
    catch(e){$('pgrid').innerHTML='';status($('pstat'),e.message,true)}},
  tile(ic,name){const t=document.createElement('div');t.className='tile';t.innerHTML=`<div class="th">${ic}</div><div class="cap"></div>`;t.lastChild.textContent=name;t.title=name;return t},
  async blobUrl(p){if(P.urls.has(p))return P.urls.get(p);const parts=await readAll(p,true);
    const u=URL.createObjectURL(new Blob(parts,{type:MIME[ext(p)]||'application/octet-stream'}));P.urls.set(p,u);
    if(P.urls.size>60){const [k,v]=P.urls.entries().next().value;URL.revokeObjectURL(v);P.urls.delete(k)}return u},
  async thumb(p,el){try{const u=await P.blobUrl(p);const im=new Image();im.alt='';im.src=u;el.textContent='';el.appendChild(im)}catch(e){}},
  async openPath(p){show('photos');await P.load(parent(p));const i=P.items.findIndex(e=>join(P.dir,e.name)===p);if(i>=0)P.view(i)},
  async view(i){if(i<0||i>=P.items.length)return;P.idx=i;const e=P.items[i],p=join(P.dir,e.name),k=kindOf(e.name);
    $('vname').textContent=e.name;$('viewer').classList.add('on');const st=$('vstage');st.textContent=T('UI_LOADING');
    try{const u=await P.blobUrl(p);if(P.idx!==i)return;st.textContent='';
      const el=document.createElement(k==='image'?'img':k==='audio'?'audio':'video');el.src=u;if(k!=='image'){el.controls=true;el.autoplay=true}st.appendChild(el)}
    catch(err){st.textContent=err.message}},
  close(){$('viewer').classList.remove('on');$('vstage').textContent='';P.idx=-1},
};
$('vclose').onclick=()=>P.close();$('vprev').onclick=()=>P.view(P.idx-1);$('vnext').onclick=()=>P.view(P.idx+1);
document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('on'))return;if(e.key==='Escape')P.close();if(e.key==='ArrowLeft')P.view(P.idx-1);if(e.key==='ArrowRight')P.view(P.idx+1)});
$('pimport').onclick=()=>$('ppick').click();
$('ppick').onchange=()=>{const l=[...$('ppick').files];$('ppick').value='';importFiles(P.dir,l,$('pstat'),()=>P.load())};

/* ----- Spindle (developer console) ----- */
const C={loaded:false,
  async load(){if(C.loaded)return;try{const r=await rpc('rpc.discover');const s=$('cmeth');s.innerHTML='';
    for(const m of r.methods){const o=document.createElement('option');o.value=o.textContent=m;s.appendChild(o)}C.loaded=true}
    catch(e){C.log('error',e.message)}},
  log(kind,text){const d=document.createElement('div');d.textContent=`${kind==='call'?'→':kind==='ok'?'←':'✗'} ${text}`;if(kind==='error')d.style.color='var(--bad)';$('cout').appendChild(d);$('cout').scrollTop=1e9},
};
$('crun').onclick=async()=>{const m=$('cmeth').value;if(!m)return;let p={};const raw=$('cparams').value.trim();
  if(raw){try{p=JSON.parse(raw)}catch(e){return C.log('error',T('UI_CONSOLE_BAD_JSON'))}}
  if(m==='zxvd.shutdown'&&!await confirmBox(T('UI_CONSOLE_STOP_Q'),T('UI_CONSOLE_STOP_TEXT'),T('UI_CONSOLE_STOP')))return;
  C.log('call',`${m} ${raw||'{}'}`);try{C.log('ok',JSON.stringify(await rpc(m,p),null,2))}catch(e){C.log('error',e.message)}};
$('cclear').onclick=()=>$('cout').textContent='';

let startApp='swarm';try{startApp=sessionStorage.getItem('zxv-app')||'swarm'}catch(e){}
show(document.getElementById('v-'+startApp)?startApp:'swarm');
</script>
