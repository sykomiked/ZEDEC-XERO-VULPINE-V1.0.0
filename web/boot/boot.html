<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZXV</title>
<style>
  html, body { margin: 0; height: 100%; background: #002911; overflow: hidden; }
  #screen { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #why { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
         color: #D8F5E1; font: 15px/1.4 system-ui, sans-serif; padding: 0 16px;
         pointer-events: none; }
</style>
    <link rel="stylesheet" href="../zxv.css">
</head>
<body>
<canvas id="screen" aria-label="ZXV is starting"></canvas>
<div id="why" role="status" aria-live="polite"></div>
<form id="card" autocomplete="off"
      style="position:fixed;left:14px;bottom:14px;display:none;gap:6px;
             background:rgba(0,31,12,.82);border:1px solid #1a4a2e;border-radius:8px;
             padding:7px 9px;font:13px ui-monospace,Menlo,monospace">
  <label for="cardid" style="color:#7BA98D">player card</label>
  <input id="cardid" size="20" spellcheck="false"
         placeholder="e.g. BSC-0-1870892d"
         style="background:#001f0c;border:1px solid #1a4a2e;border-radius:5px;
                color:#D8F5E1;padding:4px 7px;font:inherit">
  <button type="submit" style="background:#003d1a;color:#F2C230;border:1px solid #F2C230;
          border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer">seat</button>
  <button type="button" id="keygen" style="background:#003d1a;color:#D8F5E1;
          border:1px solid #1a4a2e;border-radius:5px;padding:4px 10px;font:inherit;
          cursor:pointer">generate key</button>
</form>
<script src="boot.js"></script>
<script src="zxv_bank.js"></script>
</body>
</html>
