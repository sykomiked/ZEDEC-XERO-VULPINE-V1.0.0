# ZXV edge node profile: x86_64 mini PC, 16 GB (Intel N100 / Ryzen class,
# Debian 12 or Ubuntu 24.04). Built natively on x86_64.
PROFILE=minipc
ARCH=x86_64
MEMORY_MAX_MB=12288
MEMORY_HIGH_MB=11264
THREADS=8
MODELS_DIR=/opt/zxv-edge/models
MODELS="llama-3.1-8b-instruct-q4_k_m.gguf llama-3.2-3b-instruct-q4_k_m.gguf"
NET=lan
NET_PORT=8723
PEERS=""
PEER_SERVE_PRICE=
BOOKS=state
