#
# ZXV edge node profile: Raspberry Pi 5, 8 GB (aarch64, Raspberry Pi OS
# 64-bit or Ubuntu 24.04). For the 4 GB board use MEMORY_MAX_MB=3072,
# MEMORY_HIGH_MB=2816 and one 1B-class model. Not yet run on a real board.
PROFILE=rpi5
ARCH=aarch64
# systemd limits, written into zxv-edge.service when the package is built
MEMORY_MAX_MB=6144
MEMORY_HIGH_MB=5632
THREADS=4
# models: GGUF files in MODELS_DIR. zxvd holds one model slot today, so the
# first file that exists is loaded; the rest are listed for the cluster
# advert and loaded once multi-model serving lands in zxvd.
MODELS_DIR=/opt/zxv-edge/models
MODELS="qwen2.5-1.5b-instruct-q4_k_m.gguf llama-3.2-1b-instruct-q4_k_m.gguf"
# Vinea peer network: off, lan (default here) or online
NET=lan
NET_PORT=8723
PEERS=""
# Answer peers for VFV: empty keeps it OFF (the default); a whole number of
# VFV minor units per answer turns it on. Read docs/retail/EDGE_NODES.md first.
PEER_SERVE_PRICE=
# books: state (kept in the service's state directory) or memory
BOOKS=state
