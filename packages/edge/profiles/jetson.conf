#
# ZXV edge node profile: Jetson-class board (Orin Nano 8 GB / Orin NX,
# aarch64, JetPack 6 / Ubuntu 22.04). zxvd runs its integer tensor engine
# on the CPU cores only: the GPU is not used. CPU and GPU share the board's
# memory, so leave room for the system. Not yet run on a real board.
PROFILE=jetson
ARCH=aarch64
MEMORY_MAX_MB=6144
MEMORY_HIGH_MB=5632
THREADS=6
MODELS_DIR=/opt/zxv-edge/models
MODELS="llama-3.2-3b-instruct-q4_k_m.gguf qwen2.5-1.5b-instruct-q4_k_m.gguf"
NET=lan
NET_PORT=8723
PEERS=""
PEER_SERVE_PRICE=
BOOKS=state
