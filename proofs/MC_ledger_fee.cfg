\* Fee-shaped postings (3 lines) over 4 accounts in one group, amounts
\* 1..2, fee 0..1, BalMax = 4, LineMax = 3, up to 6 accepted postings.
CONSTANTS
    Accts <- FAccts
    Owner <- FOwner
    Group <- FGroup
    Issuer <- FIssuer
    Frozen <- FNone
    Crown <- FNone
    Deltas <- FDeltas
    BalMax = 4
    LineMax = 3
    MaxLines = 3
    MaxPosts = 6
    Reqs <- FReqs
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoNegative
    NoHolderDebt
    BelowBalMax
    DebitsEqualCredits
    SupplyIsMintedMinusBurned
    NoOverflow
PROPERTIES
    PostingBalanced
CHECK_DEADLOCK FALSE
