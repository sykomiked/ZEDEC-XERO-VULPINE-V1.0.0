\* Window < MaxPosts, every request carries a nonce: R3 holds the line.
\* 3 idempotency keys, 3 UETRs, 4 accepted postings on every path.
CONSTANTS
    Keys = {1, 2, 3}
    Uetrs = {1, 2, 3}
    Nonces = {1, 2, 3}
    Window = 1
    MaxPosts = 4
SPECIFICATION Spec
INVARIANTS
    ReplayNeverApplied
    Conservation
    NoNegative
    ReverseOnce
    NoDoubleSpend
CHECK_DEADLOCK FALSE
