\* 3 accounts, 6 entries each (two transfers), 1 voucher slot each,
\* amounts 1..2, externality phase 0..1, merit 1.
CONSTANTS
    Accts = {1, 2, 3}
    EntCap = 6
    VCap = 1
    Amounts = {1, 2}
    Phases = {0, 1}
    Merits = {1}
SPECIFICATION Spec
INVARIANTS
    CapacityRespected
    TrialBalanceIsRedeemedMerit
    ConventionalMatchesTotals
    FinancialIsConventional
    ProvenanceNetsToZero
    ExternalityNetsToZero
    RedeemOnce
    RedeemedFlagMatches
    EntriesAreWholeTransfers
CHECK_DEADLOCK FALSE
