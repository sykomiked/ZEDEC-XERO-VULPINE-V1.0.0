\* Bounds: 6 accounts in 2 groups, every request of 1 or 2 lines with
\* d_debit, d_credit in -2..2 (LineMax = 1, so |2| exercises the
\* LINE_MAX_DELTA refusal), BalMax = 3 (exercises PAY_BAL_MAX), and up to
\* 5 accepted postings on every path.
CONSTANTS
    Accts <- MCAccts
    Owner <- MCOwner
    Group <- MCGroup
    Issuer <- MCIssuer
    Frozen <- MCFrozen
    Crown <- MCCrown
    Deltas <- MCDeltas
    BalMax = 3
    LineMax = 1
    MaxLines = 2
    MaxPosts = 5
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoNegative
    NoHolderDebt
    BelowBalMax
    DebitsEqualCredits
    SupplyIsMintedMinusBurned
    CrownInalienable
    NoOverflow
PROPERTIES
    FrozenNeverPays
    PostingBalanced
CHECK_DEADLOCK FALSE
