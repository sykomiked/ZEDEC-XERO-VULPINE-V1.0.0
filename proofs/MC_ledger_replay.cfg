\* Window >= MaxPosts: the ring never wraps.
\* 4 idempotency keys, 4 UETRs, 4 accepted postings on every path.
CONSTANTS
    Keys = {1, 2, 3, 4}
    Uetrs = {1, 2, 3, 4}
    Nonces = {0, 1, 2}
    Window = 4
    MaxPosts = 4
SPECIFICATION Spec
INVARIANTS
    ReplayNeverApplied
    Conservation
    NoNegative
    ReverseOnce
    NoDoubleSpend
CHECK_DEADLOCK FALSE
