\* Window < MaxPosts and no nonce: ReplayNeverApplied MUST be violated.
\* 3 idempotency keys, 3 UETRs, 3 accepted postings on every path.
CONSTANTS
    Keys = {1, 2, 3}
    Uetrs = {1, 2, 3}
    Nonces = {0}
    Window = 1
    MaxPosts = 3
SPECIFICATION Spec
INVARIANTS
    ReplayNeverApplied
    Conservation
    NoNegative
    ReverseOnce
    NoDoubleSpend
CHECK_DEADLOCK FALSE
