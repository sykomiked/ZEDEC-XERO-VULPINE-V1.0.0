    Accts = {1, 2, 3}
    EntCap = 6
    VCap = 1
    Amounts = {1, 2}
    Phases = {0, 1}
    Merits = {1}
SPECIFICATION Spec
INVARIANTS
    TrialBalanced
CHECK_DEADLOCK FALSE
