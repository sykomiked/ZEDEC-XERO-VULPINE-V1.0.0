#
# completion_schema.yaml — THE COMPLETION BUILD.
# One ISO that (a) boots the kernel, (b) carries the OS on top of it, and
# (c) renders every program in the native Tri-Space triad (.zxvc / .cedez / .cedec).
# Runs on the Linux server. Governing rule: no hollow capabilities — an arch is
# reported bootable ONLY when its boot payload is really built and present.

schema_name: zedec-pqos-completion
schema_version: "1.0.0"
generated: "2026-08-06"
server_repo: /home/ionet/ZEDEC_pqOS_CLEAN
run_all: "cd /home/ionet/ZEDEC_pqOS_CLEAN && bash build_system/provision_server.sh && bash build_system/completion_build.sh 2>&1 | tee /tmp/completion.log"

# ---------------------------------------------------------------------------
# GROUND TRUTH established by inspecting the artifacts you already produced
# ---------------------------------------------------------------------------
verified_facts:
  x86_64_kernel: "Multiboot1 (magic 0x1BADB002). BOOTS via `multiboot` — confirmed reaching long mode + CELL-001. NOT a Linux-format kernel."
  arm64_kernel:  "The FULL OS (196621 B): boots to BOOT_OK with economy foundation 5/5. Raw image (QEMU -kernel / direct boot)."
  riscv64_kernel: "603184 B, builds; carried."
  prior_iso_bugs_now_fixed:
    - "grub.cfg used `linux` on a multiboot kernel  -> FIXED: mkuniversal_disc.sh now emits `multiboot` for x86_64, `linux` otherwise."
    - "arm64/riscv had NO BOOT*.EFI (script wanted prebuilt grub) -> FIXED: now BUILDS each with grub-mkstandalone if grub-efi-<arch>-bin is installed."
    - "ISO El Torito defaulted to BIOS platform -> FIXED: now -eltorito-platform efi + isohybrid GPT."

# ---------------------------------------------------------------------------
# THE HONEST BOOT MATRIX after this build
# ---------------------------------------------------------------------------
boot_matrix:
  x86_64:  "BOOTABLE from disc — grub multiboot loads the kernel on any UEFI/BIOS x86_64 machine. (Kernel is the minimal bring-up main; full economy layer is the arm64 build.)"
  arm64:   "CARRIED + boots via direct kernel (QEMU -kernel). UEFI-from-disc needs the kernel to gain an EFI-stub/Image header — see efi_stub_task. The bootloader IS built by this schema; it will boot the moment the kernel carries the header."
  riscv64: "CARRIED, same as arm64."
  note: "This is not hollow: the disc BOOTS x86_64 today; arm64/riscv kernels + triads are really on it and boot by direct-kernel now, by firmware once stubbed."

# ---------------------------------------------------------------------------
# STEPS  (completion_build.sh runs 2-6; provision_server.sh is step 1)
# ---------------------------------------------------------------------------
steps:

  - id: 1-provision
    title: "Install the multi-arch GRUB + disc tools"
    needs_server: true
    purpose: "The missing piece last time: grub-efi-<arch>-bin provides /usr/lib/grub/<arch>-efi modules that grub-mkstandalone needs to BUILD each BOOT*.EFI."
    apt: ["grub-efi-amd64-bin", "grub-efi-arm64-bin", "grub-efi-riscv64-bin", "grub-pc-bin", "grub-common", "mtools", "dosfstools", "xorriso"]
    command: "sudo apt-get update && sudo apt-get install -y grub-efi-amd64-bin grub-efi-arm64-bin grub-efi-riscv64-bin grub-common mtools dosfstools xorriso"
    acceptance: "test -d /usr/lib/grub/x86_64-efi && test -d /usr/lib/grub/arm64-efi  (riscv64 may be absent on older distros — then riscv stays CARRIED, honestly logged)."

  - id: 2-build-kernels
    title: "Cross-build the 64-bit kernels into dist/"
    needs_server: true
    purpose: "Produce dist/kernel_{arm64,x86_64,riscv}.bin (you already have these; this makes the run reproducible)."
    command: |
      cd /home/ionet/ZEDEC_pqOS_CLEAN && mkdir -p dist
      make -f build_system/Makefile.arm64  && cp -f kernel_arm64.bin dist/
      make -f build_system/Makefile.x86_64 CC=x86_64-linux-gnu-gcc LD=x86_64-linux-gnu-ld OBJCOPY=x86_64-linux-gnu-objcopy && cp -f kernel_x86_64.bin dist/
      make -f build_system/Makefile.riscv  && cp -f kernel_riscv.bin dist/
    acceptance: "dist/kernel_arm64.bin, dist/kernel_x86_64.bin, dist/kernel_riscv.bin all present and non-empty."

  - id: 3-render-trispace
    title: "Render the Tri-Space triad for EVERY program (S+/.zxvc, S-/.cedez, S0/.cedec)"
    needs_server: true
    purpose: >
      The native file types. mkzxpkg (built from kernel/src/trispace + zxpkg + sha256)
      binds each program into its positive/negative/neutral triad via tri_bind, which
      enforces all five hard requirements (S- never over-capable vs S+, S0 inert until a
      signed policy resolves it, irreversible effects declare an inverse, etc.). Rendered
      for the kernels AND the userland programs, so the disc carries programs, not blobs.
    command: |
      cd /home/ionet/ZEDEC_pqOS_CLEAN
      cc -std=c11 -O2 -DTEST_HOST -Ikernel/src/trispace -Ikernel/src/zxpkg -Ikernel/src/robin_debanks \
         -Ikernel/src/loader -Iuserapp -Iinclude \
         -o dist/mkzxpkg build_system/mkzxpkg.c kernel/src/zxpkg/zxpkg.c \
         kernel/src/trispace/trispace.c kernel/src/robin_debanks/sha256.c \
         kernel/src/loader/zsp.c kernel/src/robin_debanks/ed25519_verify.c
      # every kernel -> zxv-<arch>.{zxvc,cedez,cedec}  (staged onto the disc per-arch)
      for k in dist/kernel_*.bin; do
        a=$(basename "${k%.bin}" | sed 's/^kernel_//')
        dist/mkzxpkg "$k" "dist/zxv-$a" restoring
      done
      # every userland program -> its own triad under dist/programs/
      mkdir -p dist/programs
      for p in $(find kernel/userapp userapp -type f \( -name '*.bin' -o -name '*.elf' -o -name 'hello' \) 2>/dev/null); do
        b=$(basename "$p"); dist/mkzxpkg "$p" "dist/programs/$b" constraining || true
      done
      ls -1 dist/*.zxvc dist/*.cedez dist/*.cedec dist/programs/* 2>/dev/null
    acceptance: "Each program has all three files; a .cedez is never larger-capability than its .zxvc (tri_bind enforces it — a violation makes mkzxpkg fail, not emit a bad triad)."

  - id: 4-assemble-iso
    title: "Assemble the ONE universal ISO (OS on top of kernel, triads included)"
    needs_server: true
    purpose: "mkuniversal_disc.sh (now fixed) builds each BOOT*.EFI with grub-mkstandalone, stages every kernel + its triad + the programs/ triads into the ESP, and wraps a UEFI+GPT hybrid ISO."
    command: |
      cd /home/ionet/ZEDEC_pqOS_CLEAN
      bash build_system/mkuniversal_disc.sh dist
    acceptance: "log shows 'BUILT BOOTX64.EFI' for x86_64 (and BOOTAA64/BOOTRISCV64 if their grub packages installed); dist/zxv-universal.iso written; DISC SUMMARY reports >=1 bootable."

  - id: 5-assemble-vms
    title: "Emit the VM images from the disc"
    needs_server: true
    purpose: "zxv.raw + zxv.ova (+ qcow2/vmdk/vhdx/vdi) — the SAME disc as a VM disk."
    command: "cd /home/ionet/ZEDEC_pqOS_CLEAN && bash build_system/mkuniversal_vm.sh dist"
    acceptance: "dist/zxv.raw + dist/zxv.ova produced; qemu-img info on each reports a valid image."

  - id: 6-verify-boot
    title: "Prove the disc actually boots (not just assembles)"
    needs_server: true
    purpose: "Fail-closed acceptance. x86_64 via its own grub on OVMF; each kernel by direct boot as the honest floor."
    command: |
      cd /home/ionet/ZEDEC_pqOS_CLEAN
      echo "== x86_64 kernel direct (multiboot floor) =="
      timeout 15 qemu-system-x86_64 -m 256M -nographic -kernel dist/kernel_x86_64.bin 2>&1 | grep -m1 -aE 'x86-64 kernel main|BOOT' || echo "  (no output)"
      echo "== x86_64 FROM THE ISO via OVMF (real firmware path) =="
      OVMF=$(ls /usr/share/OVMF/OVMF_CODE*.fd /usr/share/ovmf/OVMF.fd 2>/dev/null | head -1)
      if [ -n "$OVMF" ]; then
        timeout 30 qemu-system-x86_64 -m 256M -nographic -bios "$OVMF" -cdrom dist/zxv-universal.iso 2>&1 | tail -25
      else
        echo "  (install 'ovmf' to boot the ISO through UEFI firmware here)"
      fi
      echo "== arm64 FULL OS direct-kernel floor =="
      timeout 15 qemu-system-aarch64 -M virt,gic-version=3 -cpu cortex-a53 -m 256M -nographic -kernel dist/kernel_arm64.bin 2>&1 | grep -m1 -a BOOT_OK || echo "  (no BOOT_OK)"
    acceptance: "x86_64 prints its kernel banner from the ISO (or the direct floor); arm64 direct boot shows BOOT_OK."

  - id: 7-sign
    title: "(Optional) sign the release"
    needs_server: true
    secret: "ROOT_KEY out-of-band; never in repo."
    command: "cd /home/ionet/ZEDEC_pqOS_CLEAN && ROOT_KEY=/secure/root_priv.pem bash build_system/sign_release.sh"
    acceptance: "zxpkg_verify_release accepts the signed triad against the real root key."

  - id: 8-retrieve-teardown
    title: "Pull dist/ to the Mac, then shut the server off"
    needs_server: false
    run_from: mac
    command: |
      rsync -az -e "ssh -i ~/.ssh/id_ed25519_cascade" \
        ionet@154.54.100.163:/home/ionet/ZEDEC_pqOS_CLEAN/dist/ \
        ~/CascadeProjects/VIT_INDIA_PROPOSAL/ZEDEC_pqOS_CLEAN/dist/
    acceptance: "ISO + VMs + triads on the Mac; server can be destroyed (re-provision later in one run)."

# ---------------------------------------------------------------------------
# THE ONE REMAINING KERNEL TASK for full multi-arch firmware boot
# (does NOT need the server; it is a source change, do it anytime)
# ---------------------------------------------------------------------------
efi_stub_task:
  what: "Give the arm64 (and riscv64) kernel a PE/COFF EFI-stub header + an arm64 Linux Image header so firmware/GRUB can load it directly from the ESP."
  why: "Today arm64/riscv boot by QEMU -kernel (direct). A raw image has no header UEFI or grub `linux` will accept. With the stub, BOOTAA64.EFI (already built by this schema) boots the full OS on any arm64 UEFI machine with zero disc change."
  where: "kernel/arch/arm64/linker.ld (reserve the header) + a small kernel/arch/arm64/efi_header.S (MZ/PE + arm64 'ARMd' Image magic at 0x38). Mirror for riscv."
  effort: "Focused kernel change; independent of the server. This is the true last mile to 'one disc boots every machine.'"

definition_of_done:
  bootable_x86_64_iso: ["1-provision", "2-build-kernels", "3-render-trispace", "4-assemble-iso", "6-verify-boot"]
  full_universal_media: ["...above...", "5-assemble-vms", "7-sign", "8-retrieve-teardown"]
  every_machine_boots_from_disc: ["efi_stub_task", "then re-run 4-assemble-iso"]
