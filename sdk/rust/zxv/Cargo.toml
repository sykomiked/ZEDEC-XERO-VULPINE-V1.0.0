[package]
name = "zxv"
description = "Safe Rust SDK for the ZXV platform (libzxv)"
readme = "../README.md"
keywords = ["zxv", "ledger", "rational", "post-quantum", "inference"]
categories = ["api-bindings", "cryptography", "finance"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# Link libzxv.a statically.
static = ["zxv-sys/static"]

[dependencies]
zxv-sys = { path = "../zxv-sys", version = "1.5.0" }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor", "std"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
serde_json = "1"
