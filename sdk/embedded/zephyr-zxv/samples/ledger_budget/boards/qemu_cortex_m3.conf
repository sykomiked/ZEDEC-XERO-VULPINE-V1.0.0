# The LM3S6965 has 64 KB of RAM: room for a context, a capability, one rmag
# (~35 KB) and the fixed-memory ledger, but not also a phase clock (~22 KB).
# The sample reports the phase clock as refused (ZXV_E_NOMEM) on this board.
CONFIG_ZXV_HEAP_SIZE=40960
CONFIG_MAIN_STACK_SIZE=4096
