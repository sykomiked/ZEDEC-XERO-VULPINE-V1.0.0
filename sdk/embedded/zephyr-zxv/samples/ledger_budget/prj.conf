CONFIG_ZXV=y
CONFIG_ZXV_HEAP_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PRINTK=y
# Thread-local storage: the Zephyr SDK toolchain turns on
# CONFIG_THREAD_LOCAL_STORAGE (and CURRENT_THREAD_USE_TLS) by default, so
# libzxv keeps its last-error text per thread. Every thread, the idle thread
# included, then carries a 0x108-byte TLS block (g_err[256] plus two
# pointers), which overflows the default 256-byte idle stack and faults
# before the boot banner; hence the larger idle stack below. Toolchains
# without TLS (GNU Arm Embedded) build libzxv in ZXP_NO_TLS single-owner
# mode instead: make every ZXV call from one thread. This sample does.
CONFIG_IDLE_STACK_SIZE=640

# EMULATOR / CI ONLY: qemu_cortex_m3 and native_sim have no TRNG, so this
# sample uses Zephyr's insecure test generator. On a board, delete these two
# lines and choose CONFIG_ZXV_ENTROPY_CSPRNG (hardware entropy driver) or
# install the TRNG yourself with zxp_set_entropy() (CONFIG_ZXV_ENTROPY_NONE).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZXV_ENTROPY_INSECURE_TEST=y
