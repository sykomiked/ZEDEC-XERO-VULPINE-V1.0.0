CONFIG_ZXV=y
CONFIG_ZXV_HEAP_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_PRINTK=y
# Without CONFIG_THREAD_LOCAL_STORAGE (which needs the Zephyr SDK toolchain;
# the GNU Arm Embedded one lacks it) the module builds libzxv in ZXP_NO_TLS
# single-owner mode: make every ZXV call from one thread. This sample does.

# EMULATOR / CI ONLY: qemu_cortex_m3 and native_sim have no TRNG, so this
# sample uses Zephyr's insecure test generator. On a board, delete these two
# lines and choose CONFIG_ZXV_ENTROPY_CSPRNG (hardware entropy driver) or
# install the TRNG yourself with zxp_set_entropy() (CONFIG_ZXV_ENTROPY_NONE).
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ZXV_ENTROPY_INSECURE_TEST=y
