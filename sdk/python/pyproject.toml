[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zxv-sdk"
version = "1.4.0"
description = "Python SDK for the ZXV platform core (libzxv ABI 1.4): exact rationals, four-valued logic, 64-state hexagram tags, hardware emulation and signed hardware updates, capabilities, budgets, phase clock, UBH-168 wire, swarm economy, post-quantum crypto and a deterministic integer inference engine."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Michael Laurence Curzi and 36N9 Genetics, LLC" }]
dependencies = ["cffi>=1.15"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["zxv"]
include-package-data = false

[tool.setuptools.package-data]
# The shared library is bundled when scripts/bundle_lib.py copied it here.
zxv = ["py.typed", "_lib/*.so", "_lib/*.dylib", "_lib/*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true
files = ["src/zxv"]

[[tool.mypy.overrides]]
module = ["cffi"]
ignore_missing_imports = true
