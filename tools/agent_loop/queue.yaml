# Each task is a drafting proposal for human (or Devin) review. Files are
# relative to the repository root. ids must be unique; finished ids are
# recorded in queue.state.
- id: 1
  title: web4 east-west bridging section
  task: >-
    Draft the "Bridging the Eastern-Western CID chasm" section for
    docs/WEB4.md: how the nine-node array with a Singapore anchor, local
    pre-pinning of every shard, verified provider records, and per-region
    lpres observations avoids cross-ocean DHT walks. Ground every claim in
    the actual mechanisms below; no marketing, no "instant" or "zero-latency"
    wording. Explain exactly which component prevents which failure mode.
  files:
    - docs/WEB4.md
    - kernel/src/cisex_idx/cisex_idx.h
    - build_system/vps_seeds.conf
    - docs/curriculum/EXCHANGE.json
  context: >-
    Facts to use: nine static seeds on three continents; CISEX entries join
    per-region lpres observations (NEITHER is a no-op) and rank by
    cites*13+wants*8+live_regions*5+(joined TRUE ? 21 : 0); providers are
    verified six-byte endpoints; every node publishes its top entries as
    CISX envelopes each settle cycle; the Singapore node is the Eastern
    anchor. A query still lands on whichever node answers; there is no
    proximity routing yet — say so.
  tokens: 1400
- id: 2
  title: cisex search ui review checklist
  task: >-
    Produce a review checklist for the CISEX search panel in
    web/intro/index.html: bounds, wire-format conformance (KQ datagram,
    0xB0 reply, 168-byte UBH envelopes, payload offsets), client-side UBH
    digest verification, and failure modes (gateway without a node, stale
    origin, malformed envelope). Each checklist item must name the exact
    line or offset it guards. Do not rewrite the page; audit it.
  files:
    - web/intro/index.html
    - kernel/src/cisex_idx/cisex_rt.c
    - kernel/src/cisex_idx/cisex_idx.c
  context: >-
    Envelope: 21-byte UBH header (magic ZXV, version|class, source format
    14, target type 3, order_flags 1, flags 5, payload len 126, schema
    CISX), 126-byte payload (digest 32, name 32, kw 24, size 8, cites 4,
    wants 4, prov addr 6, n_prov, kind, lpx, armada, region, codec,
    entropy 2), 21-byte integrity trailer whose first 3 bytes are the
    SHA-256 of the first 147 bytes.
  tokens: 1200
