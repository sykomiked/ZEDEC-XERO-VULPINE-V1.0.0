# agent_loop queue — second series (web app wiring, S3 origin, desk).
- id: 1
  title: static origin boot review
  task: >-
    Review the browser boot when served from a static origin (the Filebase
    S3 website) instead of a ZXV node door: which fetches still work
    (boot.json, boot.pack, wasm), which fail (POST /cisex, /card, /l2), and
    what the page should show in each case. The search panel already takes
    a node URL; the card form and L2 bus do not. Propose the minimal UI
    changes: disable/hide the L2 bus on non-node origins, and let the card
    form target a node URL too. Ground every point in boot.js lines.
  files:
    - web/boot/boot.js
    - web/intro/index.html
  tokens: 1200
- id: 2
  title: card login pin flow review
  task: >-
    Review the player-card login flow in zxv_boot_wasm.c and boot.js: card
    person added via zb_card, pin typed into PIN_BUF, Enter raises
    card_pending, boot.js POSTs /card and answers zb_card_result. Find
    edge cases: switching persons with a half-typed pin, pin cleared on
    wrong answer, the wrong-shake state, what happens when the door is a
    static origin (no /card), and the 4-card bound. Propose fixes or
    confirm each is handled, citing lines.
  files:
    - web/boot/zxv_boot_wasm.c
    - web/boot/boot.js
    - kernel/arch/x86_64/vna_host.c
  tokens: 1200
