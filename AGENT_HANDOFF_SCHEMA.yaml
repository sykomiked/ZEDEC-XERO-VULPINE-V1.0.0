    acceptance: ["the same companion, linked on two machines, measurably gains reach"]

  - id: C5
    title: "The Holodeck — media player + live production + watch parties"
    status: planned
    priority: P2
    depends_on: [B2, B3]
    context: |
      Owner request: VLC-INSPIRED (cannot port VLC — millions of lines of GPL
