              compatibility' claims — explicit, tested routes only."
    acceptance: ["one real API v1->v2 adapter with loss/permission semantics and
                  rollback; ambiguous conversions surface as S0"]

  # ===== TRACK H — HARDWARE =================================================
  - id: H1
    title: "Reference board bring-up (off-the-shelf ARM64)"
    status: planned
    priority: P2
    context: |
      CRITICAL SEQUENCING: do NOT gate the software MVP on custom silicon. Bring
      the stack up on a supported off-the-shelf ARM64 SoM first. The way to
      improve the hardware story TODAY is to build the drivers (B1-B4) that prove
      the interface contracts — then a manufacturer can trust the schematics.
    acceptance: ["10 devices boot the same signed release; per-device identity"]

  - id: H2
    title: "Germanium chip / EPU / fractal-ID"
    status: research
    priority: P4
    context: |
      Owner interest. Keep as a PARALLEL research profile, evidence-gated, never
      a dependency of the MVP. 'Fractal computing' currently means Z-order
      locality with a MEASURED 32% reduction in data movement on structured
      traffic and 1.00x on uniform traffic (the honesty control) — keep claims at
      that level unless new measurements justify more.

  - id: H3
    title: "Manufacturing pack (schematics, BOM, EVT/DVT/PVT, compliance)"
    status: planned
    priority: P3
    depends_on: [H1]
    context: "Produced AFTER software proves the interfaces, not before."

  # ===== TRACK I — EVIDENCE / RELEASE / COMMERCIAL =========================
  - id: I1
    title: "One accurate release capsule"
    status: planned
    priority: P0
    context: |
      Audit P0-5: staged cell binaries do not match current builds; PROVENANCE
      checksums and the source SBOM are stale; evidence reports describe an older
      state. A recipient cannot answer 'which exact source constitutes this
      release?'.
      ALSO: package via `git archive` of a signed tag — NEVER a raw zip of the
      working tree. A raw zip captured the gitignored dev signing key in a prior
      release (audit P0-1). The key is gitignored and NOT in git; keep it that way.
    acceptance:
      - "binaries, SBOM, provenance, test reports, and claim ledger all generated
         from ONE clean signed commit"
      - "packaging FAILS if any hash, claim, or document references another state"
      - "0 secrets in the release artifact (scan it)"

  - id: I2
    title: "Claim ledger"
    status: planned
    priority: P1
    context: |
      Every external claim tagged verified | partial | planned | hypothesis |
      prohibited, each linked to evidence. Known claims requiring correction (do
      not restate them as fact):
        'quantum-resistant via magnetic geometry' -> category error; PQ security
          comes from ML-KEM only
        'fractal computing' -> Z-order locality, 32% measured with a 1.00x control
        'zero packet loss' -> unachievable; state bounded recoverable loss
        'mathematically immortal' -> not an engineering property
        'Chiglet is an AI model' -> it is an ISF decision runtime, NOT an LLM
        'sigils are a working processor' -> the circuit MODEL is real and tested;
          no silicon executes it
        CrimsonScale medical claims -> require a regulatory pathway; research only
    acceptance: ["every external sentence links to evidence or a limitation"]

  - id: I3
    title: "Tata Electronics pitch + reconciled legal terms"
    status: planned
    priority: P1
    depends_on: [I1, I2]
    context: |
      Owner intent: EXCLUSIVE WORLDWIDE production + global distribution, with
      the opportunity to patent the architecture through the ESTABLISHED DUBAI
      FOUNDATION structure. Research Tata Electronics' actual business model and
      capabilities and customize both the pitch AND the legal documents to them.
      BLOCKER (audit P0-8): the existing documents CONTRADICT each other —
      Rs 2,00,000/week vs Rs 20,00,000/week advance; 100% hardware revenue to VIT
      vs 20%+5% royalties; India-only vs worldwide territory; exclusive scope
      differs by document; patent status overstated. These MUST be reconciled
      into ONE counsel-reviewed term sheet before any partner circulation.
      This is not legal advice; a lawyer must review.
    acceptance:
      - "0 conflicting terms across all documents"
      - "every external company/program/patent claim has a current source"
      - "financial model has units, ASP, BOM/COGS, probability, and cash timing"

  - id: I4
    title: "Regenerate partner PDFs"
    status: planned
    priority: P3
    context: "All 13 PDFs are byte-identical to Proposal 8; missing Devanagari
              glyphs and layout defects remain. Embed Noto Sans + Noto Sans
              Devanagari; add an executive evidence dashboard; visual regression."

