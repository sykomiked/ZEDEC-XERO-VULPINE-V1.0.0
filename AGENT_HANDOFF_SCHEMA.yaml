# ----------------------------------------------------------------------------
# 0. GROUND TRUTH — verify these numbers BEFORE claiming any progress.
#    If your measured baseline differs, STOP and report; do not proceed on
#    assumptions. Every number here was measured, not remembered.
# ----------------------------------------------------------------------------
baseline_state:
  verify_all_assertions: 736         # `make -C kernel verify-all | grep -c '^\[PASS\]'`
  verify_all_failures: 0
  arm64_compiler_warnings: 0         # excluding the harmless linker build-id note
  arm64_boot_acceptance: "100/100 BOOT_OK"
  kernel_binary_bytes: 196672
  git_branch: main
  secrets_in_git: 0                  # root_priv.pem is gitignored, NOT committed
  external_audit_score: "5.7/10 (Proposal-9 audit; 'advanced pre-alpha with an
                          emulated vertical slice; not yet a defensible MVP')"

  verify_baseline_commands:
    - "cd 05_KERNEL && make -C kernel verify-all 2>&1 | grep -c '^\\[PASS\\]'   # expect 736"
    - "cd 05_KERNEL && make -f build_system/Makefile.arm64 2>&1 | grep 'warning:' | grep -v build-id | wc -l  # expect 0"
    - "cd 05_KERNEL && git ls-files | grep -E '\\.pem$|\\.key$' | wc -l   # expect 0"

# ----------------------------------------------------------------------------
# 1. NON-NEGOTIABLE RULES. These exist because this project has been burned by
#    each failure mode listed. Violating one invalidates the work.
# ----------------------------------------------------------------------------
rules:
  honesty:
    - "NEVER claim a feature works without running it. Paste real command output."
    - "A test that passes because it asserts nothing is WORSE than no test.
       Assert VALUES, not just that a function returned."
    - "If you cannot finish something, say so explicitly and leave it marked
       [partial] with the exact blocker. Do not silently narrow scope."
    - "Distinguish: built+tested vs. compiles vs. designed. Use the maturity
       labels from ROADMAP.md."
    - "Never claim 'zero warnings', 'N/N boots', or an assertion count you did
       not just measure in this session."
  engineering:
    - "Freestanding kernel: NO libc, NO malloc, NO floating point on target."
    - "surplus_real_t is `double` under -DTEST_HOST but int64 Q32.32 on target.
       NEVER hand-roll fixed-point conversions — use SR_DIV/SR_FROM_INT. A host
       test can pass while the target is silently wrong. This bug shipped once."
    - "Every new module: header with a WHY comment, .c, a host test asserting
       real values, wired into `kernel/Makefile` verify-all AND (if it belongs
       in the kernel) `build_system/Makefile.arm64`."
    - "Build must stay warning-free. Do not add warnings; do not silence them
       with casts — fix the cause or mark intent (__attribute__((unused)),
       (void)param, nonstring) with a comment explaining why."
    - "Untrusted input (network, disk, packages, cards, user pointers) must be
       bounds-checked at the boundary. Assume hostile."
  process:
    - "Commit after each completed unit with a message explaining WHY."
    - "Re-run the full gate (verify-all + build + boot) before every commit."
    - "Never `git push --force`. Never rewrite history. Never commit secrets."
    - "Do NOT delete zxv_os/, zxv_complete/, zxv_sdk/ — owner directive; they
       are archived, marked, and referenced by no build script."

# ----------------------------------------------------------------------------
# 2. ANTI-FABRICATION — how each claim must be PROVEN. Cite the exact command
#    and paste its output. Claims without evidence are rejected.
# ----------------------------------------------------------------------------
evidence_contract:
  claim_types:
    host_test_passes:
      prove_with: "the gcc command + the test's own PASS/FAIL output"
    kernel_builds:
      prove_with: "make output + `ls -la kernel_arm64.bin` + warning count"
    kernel_boots:
      prove_with: "QEMU invocation + the grep'd BOOT_OK line"
    driver_works:
      prove_with: "boot log showing the driver's ONLINE/VERIFIED line, AND a
                   functional round-trip (e.g. a frame sent and received)"
    memory_safe:
      prove_with: "the same test rebuilt with -fsanitize=address,undefined and
                   run clean"
    performance_claim:
      prove_with: "a measurement WITH a control case (e.g. Z-order locality is
                   32% fewer hops on structured traffic AND 1.00x on uniform —
                   the control is what makes it honest)"
  forbidden_substitutions:
    - "source file exists           -> feature works"
    - "unit test passes             -> boot-integrated"
    - "compiles                     -> runs"
    - "host test passes             -> target correct (see the Q32.32 trap)"
    - "simulation                   -> hardware validated"
    - "checksum matches             -> origin authenticated"
    - "no error printed             -> success"

# ----------------------------------------------------------------------------
# 3. SERVER SESSION — the box is BLANK. Provision, then build. Scripts exist.
# ----------------------------------------------------------------------------
