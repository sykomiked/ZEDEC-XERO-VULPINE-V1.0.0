      E0006 (hypothesis: boot.asm paging maps too small a window for .bss).
    acceptance:
      - "x86-64 passes the SAME mandatory acceptance suite as ARM64"
      - "CI builds AND boots both ISAs from one commit"
      - "no staged binary without reproducible source"

  - id: G2
    title: "Durable 13-phase transaction with cross-ISA identical trace"
    status: partial
    priority: P0
    depends_on: [G1, A4]
    context: |
      Chronicle (src/chronicle) ALREADY provides the durable, hash-chained,
      self-resolving judgment ledger — persisted to ZXVFS, survives power loss,
      tamper-evident, replayable. Wyrmgate provides the six-fold judgment.
      REMAINING: wire the real OSEQ/IPHASE/phase_coord registries, and make the
      event digest CANONICAL so ARM64 and x86-64 produce the SAME trace hash
      (today it hashes surplus_real_t at native width: int64 on target, double
      on host — so cross-ISA equality is NOT yet achievable).
    acceptance:
      - "one signed application request produces a complete 13-phase trace"
      - "power interrupted at every commit point; replay yields the same result"
      - "ARM64 and x86-64 semantic trace hashes MATCH"

  # ===== TRACK C — APPLICATIONS (compose existing modules) ==================
  - id: C0
    title: "Composition pattern (READ THIS BEFORE BUILDING ANY APP)"
    status: done
    context: |
      Three flagships already prove the pattern: an app is a .c that includes
      lower module headers and SEQUENCES their tested functions, adding NO new
      machinery — the interesting behavior is emergent.
        Wyrmgate   = rmag + lpres + chiglet + surplus  (six-fold Tri-Space judgment)
        WyvernEye  = refinery + wyrmgate                (intent forged, then judged)
        Chronicle  = wyrmgate + sha256 (+ zxvfs)        (durable tamper-evident memory)
      Follow this pattern. Do not reimplement what a module already does.

  - id: C1
    title: "Den Connect node — the P2P social server"
    status: partial
    priority: P1
    depends_on: [B1, B2]
    context: |
