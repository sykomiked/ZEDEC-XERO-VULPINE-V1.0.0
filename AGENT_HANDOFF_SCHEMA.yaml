# 5. RECOMMENDED EXECUTION ORDER (dependency-correct, highest leverage first)
# ----------------------------------------------------------------------------
execution_order:
  - "S1-S2  provision + reproduce baseline (NEVER skip; proves the environment)"
  - "B1     virtio-net probe fix + functional round-trip"
  - "B2     network stack -> DHCP/DNS/TCP/TLS"
