  - "G1     x86-64 parity"
  - "A4     real protected cell backend"
  - "G2     durable 13-phase + cross-ISA canonical trace"
  - "I1     one accurate release capsule (now the claims are true)"
  - "C1     Den Connect node over real networking"
  - "D1/D2  content-addressed store + mass networking"
  - "C3/C8  recovery utility + portable identity"
  - "C5/C6/C7  Holodeck, security suite, consumer shell"
