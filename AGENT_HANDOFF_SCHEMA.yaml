# ----------------------------------------------------------------------------
# 6. DEFINITION OF DONE (from the external audit — the real bar)
# ----------------------------------------------------------------------------
definition_of_done:
  technical_mvp: |
    An independent engineer can: install one threshold-signed ZXV release from
    bootable media onto blank ARM64 AND x86-64 virtual disks; boot a protected
    user-space session; use P-TERM; persist files; execute only signed
    applications; submit and recover one full durable 13-phase Tri-Space
    transaction; kill and restart one protected service cell without losing
    sibling state; interrupt an A/B system update at every transition and
    recover; reach a TLS endpoint; and reproduce the entire evidence capsule
    from the signed source commit with zero warnings, mismatches, skipped
    mandatory tests, bundled secrets, or unsupported claims.
  partner_ready: "technical MVP + ONE counsel-reviewed term sheet + verified
                  claims + a named reference board + a costed plan"
  note: |
    No architecture earns a permanent 10/10. The operational equivalent is
    CONTINUOUS CONFORMANCE: every promoted subsystem satisfies its current
    threat, evidence, safety, legal, and lifecycle gates; a regression
    automatically demotes the release; research stays labeled and isolated
    until independently validated.

# ----------------------------------------------------------------------------
# 7. REPORTING — what to hand back
# ----------------------------------------------------------------------------
reporting:
  per_item:
    - "item id + final status (done | partial | blocked)"
    - "the exact commands run and their real output"
    - "assertion count before and after"
    - "what you did NOT finish and precisely why"
  session_end:
    - "verify-all count, warning count, boot acceptance — all freshly measured"
    - "git log of everything committed"
    - "an honest list of every remaining open item"
  forbidden:
    - "summarizing work you did not run"
    - "reporting a number you did not measure this session"
    - "marking an item done when a sub-acceptance criterion failed"
