work_items:

  # ===== TRACK B — NETWORKING (do first; everything social depends on it) ====
  - id: B1
    title: "virtio-net probe fix + functional round-trip"
    status: partial
    priority: P0
    files: ["kernel/arch/arm64/virtio_net.c", "kernel/src/virtio/vring.c"]
    context: |
      The split-virtqueue engine (src/virtio/vring) is DONE and heavily tested:
      20,000 chains through both ring wrap points, free list intact, ASan/UBSan
      clean, 21 assertions in verify-all. The ARM64 driver builds warning-free,
      links, and boots.
      KNOWN OPEN: the MMIO probe does not match QEMU's virtio-net device. Local
      testing with `-device virtio-net-device,netdev=n0` hit the SKIP path. The
      scan finds a device with id 1 at a slot but the bring-up does not complete.
      Investigate: VERSION==2 check, slot stride (0x200), device-id read timing,
      and whether QEMU presents the NIC as a PCI device instead of MMIO on this
      machine type (may need `-machine virt` MMIO transport or virtio-pci).
    acceptance:
      - "boot log shows '[DRIVER ONLINE] virtio-net' and a non-zero MAC"
      - "virtio_net_selftest() returns true in the boot banner"
      - "FUNCTIONAL PROOF: transmit a frame and observe it (e.g. an ARP request
         captured on the host side, or a loopback frame received back). A driver
         that initializes but never moves a byte is NOT done."
    unblocks: [B2, C1, D1, D3, D4, C5]

  - id: B2
    title: "Network stack: ARP/IP/ICMP/UDP/TCP, DHCP, DNS, TLS 1.3 client"
    status: planned
    priority: P0
    depends_on: [B1]
    context: |
      src/net/ has protocol structures + a loopback interface already. Wire the
      real NIC to it, then build up. Reuse the audited crypto (src/robin_debanks)
      for TLS — do NOT write new crypto.
    acceptance:
      - "DHCP obtains a lease in QEMU user-mode networking"
      - "DNS resolves a name; ICMP ping round-trips"
      - "TCP connects and transfers to a reference server"
      - "TLS 1.3 to a real endpoint; certificate validation rejects bad/expired/
         wrong-name certs (test all three)"
      - "malformed-packet fuzzing does not fault the kernel"

  # ===== TRACK A — SECURITY P0s (the gate to any partner) ====================
  - id: A1
    title: "Finish the EL0 user-copy boundary"
    status: partial
    priority: P0
    files: ["kernel/arch/arm64/el0_userspace.c"]
    context: |
      DONE already: SYS_RECV now validates the destination page is WRITABLE
      (proc_user_range_check(..., need_write=true)) — a red-team finding.
      REMAINING: fault-safe copy_to_user; SYS_SEND should copy into a bounded
      kernel buffer rather than passing the raw user pointer to ipc_send;
      SYS_OPEN/SYS_CLOSE are capability-classified but have NO handlers (must
      either implement or return a stable ENOSYS); copy_from_user has no guarded
      fault recovery.
    acceptance:
      - "kernel never dereferences an untrusted user pointer directly"
      - "a read-only or unmapped buffer returns EFAULT, never faults EL1"
      - "cross-page partial mappings return EFAULT with NO partial effect"
      - "unknown syscalls return a stable ENOSYS"
      - "syscall fuzzer: >=1,000,000 cases, no kernel fault"

  - id: A2
    title: "ZSP v2 signed packages + cryptographic anti-rollback"
    status: planned
    priority: P0
    files: ["kernel/src/loader/zsp.c", "kernel/src/loader/abupdate.c"]
    context: |
      Current ZSP signs only {magic, payload_len, payload_hash}. It does NOT
      bind identity, version, architecture, ABI, key id, capabilities, or expiry.
      Worse: ab_stage_update sets version = active+1, so an OLD but validly
      signed package can be reintroduced as 'new'.
    acceptance:
      - "signed preimage covers: package id, semantic version, architecture,
         kernel ABI, signing key id, capabilities, dependencies, expiry,
         monotonic security version"
      - "an old signed package below the security floor is REJECTED"
      - "wrong architecture/ABI rejected BEFORE mapping"
      - "expired or revoked signer rejected"
      - "production profile refuses raw unsigned .elf (dev bypass must be explicit)"
      - "parser fuzzed >=1,000,000 cases without defect"

  - id: A3
    title: "Signed path-safe installer + SYSTEM-level A/B with recovery"
    status: planned
    priority: P0
    files: ["build_system/install_zxv.py", "build_system/transactional_disk.py"]
    context: |
      The installer trusts an UNSIGNED JSON manifest and checks hashes from that
      same manifest (an attacker replaces both). Paths are not confined: absolute
      paths, '..', and symlinks can escape. It writes payloads BEFORE persisting
      the rollback journal, and never fsyncs. A/B protects only ONE APPLICATION —
      not the bootloader, kernel, or system image.
    acceptance:
      - "unsigned or under-threshold metadata is REJECTED before any payload parse"
      - "malicious-manifest suite: 0 escapes outside the target image"
      - "journal + fsync BEFORE any target mutation"
      - "power cut at EVERY transition -> old OR new system boots, never broken"
      - "immutable recovery environment boots when both slots fail"
      - ">=10,000 randomized interruption runs pass"

  - id: A4
    title: "Real protected cell backend (not a struct flag)"
    status: planned
    priority: P0
    files: ["kernel/src/cellular_multikernel/cellular_multikernel.c"]
    context: |
      Cells are structs in ONE address space. cell_fabric_execute can mark a cell
      ACTIVE with no execution backend bound. Authentication compares caller-
      supplied digest bytes (not a signature). crit168_from_digest is an explicit
      XOR-fold PLACEHOLDER. The transport assigns event_id = 0.
      Red-team already fixed: unvalidated transport_count OOB (CRITICAL), stale
      execution context leak, DEFER/COMPENSATE counted as commit approvals,
      RECOVERING kept live routes, route-table exhaustion. Do not regress these.
    acceptance:
      - "a cell without an execution backend CANNOT become ACTIVE"
      - "cell boundary enforced by process/VM (not a flag)"
      - "digest-equality auth replaced by signature/attestation"
      - "XOR placeholder replaced by a real cryptographic digest"
      - "DEMO: kill one cell mid-transaction; a sibling completes and persists;
         the coordinator restarts/replays the killed one"

  - id: A5
    title: "Entropy + key lifecycle"
    status: planned
    priority: P1
    context: |
      RNDR is detected with an honest fallback message, but there is no DRBG, no
      continuous health test across calls (prev is a local), no reseed policy, no
      secure key store, no zeroization proof, no rotation/revocation/recovery.
      On QEMU without RNDR it warns and CONTINUES initializing security-sensitive
      vault behavior with predictable material.
    acceptance:
      - "production profile FAILS CLOSED (refuses secret creation) without
         trustworthy entropy; test profile uses an explicitly seeded DRBG"
      - "continuous health test persists across calls; repeated-output trips it"
      - "0 nonce reuse across a reboot/restore campaign"
      - "documented offline root ceremony + revocation list"

  - id: A6
    title: "Flip build to -Werror"
    status: planned
    priority: P2
    context: "Build is currently warning-free (104 -> 0) but not -Werror enforced."
    acceptance: ["ARM64 + host builds pass with -Werror; CI fails on any warning"]

  # ===== TRACK G — CROSS-ISA PARITY (MVP gate) ==============================
  - id: G1
    title: "x86-64 feature parity"
    status: partial
    priority: P0
    context: |
      x86-64 is a BOOTSTRAP demo only. It lacks ring-3 user mode, preemption,
